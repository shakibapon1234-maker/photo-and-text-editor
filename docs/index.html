<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Photo & 3D Text Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: #0f1115;
    color: #e5e7eb;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header.suite-header {
    height: 54px;
    background: #161920;
    border-bottom: 1px solid #282d37;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    z-index: 100;
  }
  .suite-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    color: #f3f4f6;
  }
  .suite-brand-mark {
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .suite-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0b0d11;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid #232731;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: #9ca3af;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .tab-btn:hover {
    color: #f3f4f6;
  }
  .tab-btn.active {
    background: #f59e0b;
    color: #000;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
  }
  .suite-body {
    flex: 1;
    position: relative;
    width: 100%;
    height: calc(100vh - 54px);
  }
  iframe.app-frame {
    width: 100%;
    height: 100%;
    border: none;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
  }
  iframe.app-frame.active {
    display: block;
  }
</style>
</head>
<body>

  <header class="suite-header">
    <div class="suite-brand">
      <div class="suite-brand-mark">◆</div>
      <span>Photo & 3D Text Studio</span>
    </div>

    <div class="suite-tabs">
      <button class="tab-btn active" id="tabPhotoBtn" onclick="switchTab('photo')">
        <span>📷 ফটো এডিটর (Photo Editor)</span>
      </button>
      <button class="tab-btn" id="tab3dBtn" onclick="switchTab('3d')">
        <span>🧊 ৩D টেক্সট স্টুডিও (3D Studio)</span>
      </button>
      <button class="tab-btn" id="tabLogoBtn" onclick="switchTab('logo')">
        <span>🔄 অ্যানিমেটেড লোগো (Logo Motion)</span>
      </button>
      <button class="tab-btn" id="tabPromoBtn" onclick="switchTab('promo')">
        <span>📱 প্রোমো মোশন (Promo Motion)</span>
      </button>
      <button class="tab-btn" id="tab3dLogoMotionBtn" onclick="switchTab('3dLogoMotion')">
        <span>✨ ৩D লোগো মোশন (3D Logo Motion)</span>
      </button>
    </div>
  </header>

  <main class="suite-body">
    <iframe id="framePhoto" class="app-frame active" src="photo-editor/index.html"></iframe>
    <iframe id="frame3d" class="app-frame" src="3d-text-module-phase5-quality/3d-text-module/www/index.html?v=1.2.0"></iframe>
    <iframe id="frameLogo" class="app-frame" src="spinning-circle-animation.html"></iframe>
    <iframe id="framePromo" class="app-frame" src="promo-motion-studio.html"></iframe>
    <iframe id="frame3dLogoMotion" class="app-frame" src="3d-logo-motion-studio.html"></iframe>
  </main>

  <script>
    function switchTab(tab) {
      const framePhoto = document.getElementById('framePhoto');
      const frame3d = document.getElementById('frame3d');
      const frameLogo = document.getElementById('frameLogo');
      const framePromo = document.getElementById('framePromo');
      const frame3dLogoMotion = document.getElementById('frame3dLogoMotion');
      const tabPhotoBtn = document.getElementById('tabPhotoBtn');
      const tab3dBtn = document.getElementById('tab3dBtn');
      const tabLogoBtn = document.getElementById('tabLogoBtn');
      const tabPromoBtn = document.getElementById('tabPromoBtn');
      const tab3dLogoMotionBtn = document.getElementById('tab3dLogoMotionBtn');

      if (tab === 'photo') {
        framePhoto.classList.add('active');
        frame3d.classList.remove('active');
        frameLogo.classList.remove('active');
        framePromo.classList.remove('active');
        frame3dLogoMotion.classList.remove('active');
        tabPhotoBtn.classList.add('active');
        tab3dBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tab3dLogoMotionBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'photo'); } catch (_) {}
      } else if (tab === '3d') {
        frame3d.classList.add('active');
        framePhoto.classList.remove('active');
        frameLogo.classList.remove('active');
        framePromo.classList.remove('active');
        frame3dLogoMotion.classList.remove('active');
        tab3dBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tab3dLogoMotionBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', '3d'); } catch (_) {}
      } else if (tab === 'logo') {
        frameLogo.classList.add('active');
        framePhoto.classList.remove('active');
        frame3d.classList.remove('active');
        framePromo.classList.remove('active');
        frame3dLogoMotion.classList.remove('active');
        tabLogoBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tab3dBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tab3dLogoMotionBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'logo'); } catch (_) {}
      } else if (tab === 'promo') {
        framePromo.classList.add('active');
        framePhoto.classList.remove('active');
        frame3d.classList.remove('active');
        frameLogo.classList.remove('active');
        frame3dLogoMotion.classList.remove('active');
        tabPromoBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tab3dBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tab3dLogoMotionBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'promo'); } catch (_) {}
      } else if (tab === '3dLogoMotion') {
        frame3dLogoMotion.classList.add('active');
        framePhoto.classList.remove('active');
        frame3d.classList.remove('active');
        frameLogo.classList.remove('active');
        framePromo.classList.remove('active');
        tab3dLogoMotionBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tab3dBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', '3dLogoMotion'); } catch (_) {}
      }
    }

    function triggerGlobalClear() {
      const isPhoto = document.getElementById('framePhoto').classList.contains('active');
      if (isPhoto) {
        try {
          const frame = document.getElementById('framePhoto');
          const doc = frame.contentDocument || frame.contentWindow.document;
          const btn = doc.getElementById('clearAllEditsBtn');
          if (btn) {
            btn.click();
          } else {
            frame.contentWindow.location.reload();
          }
        } catch(e) {
          console.warn('Clear photo error', e);
        }
      } else if (document.getElementById('frame3d').classList.contains('active')) {
        try {
          const frame = document.getElementById('frame3d');
          const win = frame.contentWindow;
          if (win && typeof win.reset3DStudio === 'function') {
            win.reset3DStudio();
          } else {
            const doc = frame.contentDocument || win.document;
            const btn = doc.getElementById('reset3DStudioBtn') || doc.getElementById('topbarResetBtn');
            if (btn) btn.click();
            else win.location.reload();
          }
        } catch(e) {
          console.warn('Clear 3D error', e);
        }
      } else if (document.getElementById('frameLogo').classList.contains('active')) {
        try {
          const frame = document.getElementById('frameLogo');
          const win = frame.contentWindow;
          if (win && typeof win.resetAll === 'function') win.resetAll();
          else win.location.reload();
        } catch(e) {
          console.warn('Clear logo error', e);
        }
      } else if (document.getElementById('framePromo').classList.contains('active')) {
        try {
          const frame = document.getElementById('framePromo');
          const win = frame.contentWindow;
          if (win && typeof win.resetPromoMotion === 'function') win.resetPromoMotion();
          else win.location.reload();
        } catch(e) {
          console.warn('Clear promo error', e);
        }
      } else {
        try {
          const frame = document.getElementById('frame3dLogoMotion');
          const win = frame.contentWindow;
          if (win && typeof win.resetStudio === 'function') win.resetStudio();
          else win.location.reload();
        } catch(e) {
          console.warn('Clear 3D logo motion error', e);
        }
      }
    }

    // Auto-restore active tab on refresh/page load
    document.addEventListener('DOMContentLoaded', () => {
      let savedTab = 'photo';
      try {
        savedTab = localStorage.getItem('active_studio_tab') || 'photo';
      } catch (_) {}
      if (savedTab === '3d' || savedTab === 'logo' || savedTab === 'promo' || savedTab === '3dLogoMotion') switchTab(savedTab);
    });
  </script>
</body>
</html>
