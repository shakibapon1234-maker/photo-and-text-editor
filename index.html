<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Photo & 3D Text Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: #0f1115;
    color: #e5e7eb;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header.suite-header {
    height: 54px;
    background: #161920;
    border-bottom: 1px solid #282d37;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    z-index: 100;
  }
  .suite-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    color: #f3f4f6;
  }
  .suite-brand-mark {
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .suite-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0b0d11;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid #232731;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: #9ca3af;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .tab-btn:hover {
    color: #f3f4f6;
  }
  .tab-btn.active {
    background: #f59e0b;
    color: #000;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
  }
  .suite-body {
    flex: 1;
    position: relative;
    width: 100%;
    height: calc(100vh - 54px);
  }
  iframe.app-frame {
    width: 100%;
    height: 100%;
    border: none;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
  }
  iframe.app-frame.active {
    display: block;
  }
</style>
</head>
<body>

  <header class="suite-header">
    <div class="suite-brand">
      <div class="suite-brand-mark">◆</div>
      <span>Photo & 3D Text Studio</span>
    </div>

    <div class="suite-tabs">
      <button class="tab-btn active" id="tabPhotoBtn" onclick="switchTab('photo')">
        <span>📷 ফটো এডিটর (Photo Editor)</span>
      </button>
      <button class="tab-btn" id="tab3dBtn" onclick="switchTab('3d')">
        <span>🧊 ৩D টেক্সট স্টুডিও (3D Studio)</span>
      </button>
    </div>
  </header>

  <main class="suite-body">
    <iframe id="framePhoto" class="app-frame active" src="photo-editor/index.html"></iframe>
    <iframe id="frame3d" class="app-frame" src="3d-text-module-phase5-quality/3d-text-module/www/index.html"></iframe>
  </main>

  <script>
    function switchTab(tab) {
      const framePhoto = document.getElementById('framePhoto');
      const frame3d = document.getElementById('frame3d');
      const tabPhotoBtn = document.getElementById('tabPhotoBtn');
      const tab3dBtn = document.getElementById('tab3dBtn');

      if (tab === 'photo') {
        framePhoto.classList.add('active');
        frame3d.classList.remove('active');
        tabPhotoBtn.classList.add('active');
        tab3dBtn.classList.remove('active');
      } else {
        frame3d.classList.add('active');
        framePhoto.classList.remove('active');
        tab3dBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
      }
    }
  </script>
</body>
</html>
