<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Photo & 3D Text Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: #0f1115;
    color: #e5e7eb;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header.suite-header {
    height: 54px;
    background: #161920;
    border-bottom: 1px solid #282d37;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    z-index: 100;
  }
  .suite-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    color: #f3f4f6;
  }
  .suite-brand-mark {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: radial-gradient(circle at 35% 30%, #ffdb9a, #ef4444 48%, #710d17 100%);
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: -.5px;
    box-shadow: 0 0 12px rgba(239, 68, 68, .55);
  }
  .suite-brand-mark::before {
    content: '✦ PHOTO ✦ 3D ✦';
    position: absolute;
    inset: 2px;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255,255,255,.88);
    border-radius: 50%;
    font-size: 4px;
    letter-spacing: 1.2px;
    color: #fff;
    animation: suite-logo-spin 7s linear infinite;
  }
  .suite-brand-mark span { position: relative; z-index: 1; }
  @keyframes suite-logo-spin { to { transform: rotate(360deg); } }
  .suite-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0b0d11;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid #232731;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: #9ca3af;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .tab-btn:hover {
    color: #f3f4f6;
  }
  .tab-btn.active {
    background: #f59e0b;
    color: #000;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
  }
  .suite-body {
    flex: 1;
    position: relative;
    width: 100%;
    height: calc(100vh - 54px);
  }
  iframe.app-frame {
    width: 100%;
    height: 100%;
    border: none;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
  }
  iframe.app-frame.active {
    display: block;
  }
</style>
</head>
<body>

  <header class="suite-header">
    <div class="suite-brand">
      <div class="suite-brand-mark" aria-label="Photo and 3D Text Studio animated logo"><span>PS</span></div>
      <span>Photo & 3D Text Studio</span>
    </div>

    <div class="suite-tabs">
      <button class="tab-btn active" id="tabPhotoBtn" onclick="switchTab('photo')">
        <span>📷 ফটো এডিটর (Photo Editor)</span>
      </button>
      <button class="tab-btn" id="tab3dBtn" onclick="switchTab('3d')">
        <span>🧊 ৩D টেক্সট স্টুডিও (3D Studio)</span>
      </button>
      <button class="tab-btn" id="tabLogoBtn" onclick="switchTab('logo')">
        <span>🔄 অ্যানিমেটেড লোগো (Logo Motion)</span>
      </button>
      <button class="tab-btn" id="tabPromoBtn" onclick="switchTab('promo')">
        <span>📱 প্রোমো মোশন (Promo Motion)</span>
      </button>
      <button class="tab-btn" id="tabDesignBtn" onclick="switchTab('design')">
        <span>✨ ডিজাইন টুলস (Design Tools)</span>
      </button>
      <button class="tab-btn" id="tabPresentationBtn" onclick="switchTab('presentation')">
        <span>📊 প্রেজেন্টেশন (Presentation)</span>
      </button>
    </div>
    <button class="tab-btn" id="sendActiveToPresentationBtn" onclick="sendActiveToPresentation()" title="বর্তমান tab-এর preview Presentation Asset Library-তে পাঠান" style="color:#67e8f9;border:1px solid #24516a;">📤 Presentation-এ পাঠান</button>
  </header>

  <main class="suite-body">
    <iframe id="framePhoto" class="app-frame active" src="photo-editor/index.html"></iframe>
    <iframe id="frame3d" class="app-frame" src="3d-text-module-phase5-quality/3d-text-module/www/index.html?v=1.2.0"></iframe>
    <iframe id="frameLogo" class="app-frame" src="spinning-circle-animation.html"></iframe>
    <iframe id="framePromo" class="app-frame" src="promo-motion-studio.html"></iframe>
    <iframe id="frameDesign" class="app-frame" src="design-tools.html"></iframe>
    <iframe id="framePresentation" class="app-frame" data-src="presentation-studio.html"></iframe>
  </main>

  <script>
    function switchTab(tab) {
      const framePhoto = document.getElementById('framePhoto');
      const frame3d = document.getElementById('frame3d');
      const frameLogo = document.getElementById('frameLogo');
      const framePromo = document.getElementById('framePromo');
      const frameDesign = document.getElementById('frameDesign');
      const framePresentation = document.getElementById('framePresentation');
      const tabPhotoBtn = document.getElementById('tabPhotoBtn');
      const tab3dBtn = document.getElementById('tab3dBtn');
      const tabLogoBtn = document.getElementById('tabLogoBtn');
      const tabPromoBtn = document.getElementById('tabPromoBtn');
      const tabDesignBtn = document.getElementById('tabDesignBtn');
      const tabPresentationBtn = document.getElementById('tabPresentationBtn');

      if (tab === 'photo') {
        framePhoto.classList.add('active');
        frame3d.classList.remove('active');
        frameLogo.classList.remove('active');
        framePromo.classList.remove('active');
        frameDesign.classList.remove('active');
        framePresentation.classList.remove('active');
        tabPhotoBtn.classList.add('active');
        tab3dBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tabDesignBtn.classList.remove('active');
        tabPresentationBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'photo'); } catch (_) {}
      } else if (tab === '3d') {
        frame3d.classList.add('active');
        framePhoto.classList.remove('active');
        frameLogo.classList.remove('active');
        framePromo.classList.remove('active');
        frameDesign.classList.remove('active');
        framePresentation.classList.remove('active');
        tab3dBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tabDesignBtn.classList.remove('active');
        tabPresentationBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', '3d'); } catch (_) {}
      } else if (tab === 'logo') {
        frameLogo.classList.add('active');
        framePhoto.classList.remove('active');
        frame3d.classList.remove('active');
        framePromo.classList.remove('active');
        frameDesign.classList.remove('active');
        framePresentation.classList.remove('active');
        tabLogoBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tab3dBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tabDesignBtn.classList.remove('active');
        tabPresentationBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'logo'); } catch (_) {}
      } else if (tab === 'promo') {
        framePromo.classList.add('active');
        framePhoto.classList.remove('active');
        frame3d.classList.remove('active');
        frameLogo.classList.remove('active');
        frameDesign.classList.remove('active');
        framePresentation.classList.remove('active');
        tabPromoBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tab3dBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabDesignBtn.classList.remove('active');
        tabPresentationBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'promo'); } catch (_) {}
      } else if (tab === 'design') {
        frameDesign.classList.add('active');
        framePhoto.classList.remove('active');
        frame3d.classList.remove('active');
        frameLogo.classList.remove('active');
        framePromo.classList.remove('active');
        framePresentation.classList.remove('active');
        tabDesignBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tab3dBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tabPresentationBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'design'); } catch (_) {}
      } else if (tab === 'presentation') {
        if (!framePresentation.src) framePresentation.src = framePresentation.dataset.src;
        framePresentation.classList.add('active');
        framePhoto.classList.remove('active');
        frame3d.classList.remove('active');
        frameLogo.classList.remove('active');
        framePromo.classList.remove('active');
        frameDesign.classList.remove('active');
        tabPresentationBtn.classList.add('active');
        tabPhotoBtn.classList.remove('active');
        tab3dBtn.classList.remove('active');
        tabLogoBtn.classList.remove('active');
        tabPromoBtn.classList.remove('active');
        tabDesignBtn.classList.remove('active');
        try { localStorage.setItem('active_studio_tab', 'presentation'); } catch (_) {}
      }
    }

    function triggerGlobalClear() {
      const isPhoto = document.getElementById('framePhoto').classList.contains('active');
      if (isPhoto) {
        try {
          const frame = document.getElementById('framePhoto');
          const doc = frame.contentDocument || frame.contentWindow.document;
          const btn = doc.getElementById('clearAllEditsBtn');
          if (btn) {
            btn.click();
          } else {
            frame.contentWindow.location.reload();
          }
        } catch(e) {
          console.warn('Clear photo error', e);
        }
      } else if (document.getElementById('frame3d').classList.contains('active')) {
        try {
          const frame = document.getElementById('frame3d');
          const win = frame.contentWindow;
          if (win && typeof win.reset3DStudio === 'function') {
            win.reset3DStudio();
          } else {
            const doc = frame.contentDocument || win.document;
            const btn = doc.getElementById('reset3DStudioBtn') || doc.getElementById('topbarResetBtn');
            if (btn) btn.click();
            else win.location.reload();
          }
        } catch(e) {
          console.warn('Clear 3D error', e);
        }
      } else if (document.getElementById('frameLogo').classList.contains('active')) {
        try {
          const frame = document.getElementById('frameLogo');
          const win = frame.contentWindow;
          if (win && typeof win.resetAll === 'function') win.resetAll();
          else win.location.reload();
        } catch(e) {
          console.warn('Clear logo error', e);
        }
      } else if (document.getElementById('framePromo').classList.contains('active')) {
        try {
          const frame = document.getElementById('framePromo');
          const win = frame.contentWindow;
          if (win && typeof win.resetPromoMotion === 'function') win.resetPromoMotion();
          else win.location.reload();
        } catch(e) {
          console.warn('Clear promo error', e);
        }
      } else {
        try {
          const frame = document.getElementById('frameDesign');
          const win = frame.contentWindow;
          if (win && typeof win.resetDesignTools === 'function') win.resetDesignTools();
          else win.location.reload();
        } catch(e) {
          console.warn('Clear design tools error', e);
        }
      }
    }

    // A suite-wide handoff: all visual tools expose a canvas or preview image.
    // Capture it in one place so every tab can send an asset to Presentation.
    async function sendActiveToPresentation() {
      const pairs = [
        ['framePhoto', 'Photo Editor output', '#previewImage'],
        ['frame3d', '3D Studio output', '#scene-canvas'],
        ['frameLogo', 'Logo Motion output', '#spinCanvas'],
        ['framePromo', 'Promo Motion output', '#c'],
        ['frameDesign', 'Design Tools output', '#canvas']
      ];
      const active = pairs.find(([frameId]) => document.getElementById(frameId).classList.contains('active'));
      if (!active) { alert('প্রথমে একটি visual tool খুলুন।'); return; }
      const [frameId, name, selector] = active;
      const frame = document.getElementById(frameId);
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const source = doc.querySelector(selector);
        if (!source) throw new Error('Preview পাওয়া যায়নি');
        let dataUrl;
        if (source.tagName === 'CANVAS') dataUrl = source.toDataURL('image/png');
        else {
          const temp = document.createElement('canvas');
          temp.width = source.naturalWidth || source.width;
          temp.height = source.naturalHeight || source.height;
          temp.getContext('2d').drawImage(source, 0, 0);
          dataUrl = temp.toDataURL('image/png');
        }
        const key = 'presentation-studio-assets-v1';
        const items = JSON.parse(localStorage.getItem(key) || '[]');
        items.push({ src: dataUrl, added: Date.now(), name });
        localStorage.setItem(key, JSON.stringify(items.slice(-30)));
        localStorage.setItem('presentation-studio-pending-asset-v1', JSON.stringify({ src: dataUrl, added: Date.now(), name }));
        alert(`✅ ${name} Presentation Asset Library-তে পাঠানো হয়েছে।`);
      } catch (err) {
        console.error(err);
        alert('বর্তমান preview পাঠানো যায়নি। আগে content তৈরি করুন, তারপর আবার চেষ্টা করুন।');
      }
    }

    // Animated tools use a compact video handoff; still-image tools retain
    // the original PNG asset flow above.
    const sendActiveToPresentationImage = sendActiveToPresentation;
    async function sendActiveToPresentation() {
      const animated = [
        ['frame3d', '3D Studio video', '#scene-canvas'],
        ['frameLogo', 'Logo Motion video', '#spinCanvas'],
        ['framePromo', 'Promo Motion video', '#c']
      ];
      const active = animated.find(([id]) => document.getElementById(id).classList.contains('active'));
      if (!active) return sendActiveToPresentationImage();
      const [frameId, name, selector] = active, frame = document.getElementById(frameId), button = document.getElementById('sendActiveToPresentationBtn');
      try {
        const sourceDoc = frame.contentDocument || frame.contentWindow.document;
        const canvas = sourceDoc.querySelector(selector);
        if (!canvas?.captureStream || !window.MediaRecorder) throw new Error('Video capture is unavailable');
        // 3D Studio renders its preset only after Play/Restart. Trigger it before
        // capture, so the transferred WebM contains the actual animation, not a still.
        if (frameId === 'frame3d') {
          const play = sourceDoc.getElementById('animPlayBtn');
          if (play && !play.disabled) { play.click(); await new Promise(resolve => setTimeout(resolve, 120)); }
        }
        const promoDuration = frameId === 'framePromo' ? Number((frame.contentDocument || frame.contentWindow.document).getElementById('duration')?.value || 5) * 1000 : 5000;
        const duration = Math.min(8000, Math.max(3000, promoDuration));
        button.disabled = true; button.textContent = '⏳ ভিডিও তৈরি হচ্ছে…';
        const stream = canvas.captureStream(24), chunks = [];
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm', videoBitsPerSecond: 1200000 });
        recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const presentation = document.getElementById('framePresentation');
          const add = () => {
            const receiver = presentation.contentWindow?.PresentationMedia;
            if (!receiver) throw new Error('Presentation video receiver is not ready');
            receiver.addBlob(blob);
            button.disabled = false; button.textContent = '📤 Presentation-এ পাঠান';
            alert(`✅ ${name} current slide-এ video হিসেবে যুক্ত হয়েছে।`);
          };
          try {
            if (!presentation.getAttribute('src')) {
              presentation.src = presentation.dataset.src || 'presentation-studio.html';
              presentation.addEventListener('load', () => setTimeout(add, 300), { once: true });
            } else add();
            switchTab('presentation');
          } catch (error) { console.error(error); button.disabled = false; button.textContent = '📤 Presentation-এ পাঠান'; alert('ভিডিও পাঠানো যায়নি। Presentation tab একবার খুলে আবার চেষ্টা করুন।'); }
        };
        recorder.start(); const started = performance.now();
        const finish = now => { if (now - started < duration) requestAnimationFrame(finish); else recorder.stop(); };
        requestAnimationFrame(finish);
      } catch (error) {
        console.error(error); button.disabled = false; button.textContent = '📤 Presentation-এ পাঠান';
        alert('এই preview থেকে video তৈরি করা যায়নি। Tool-টি আগে চালু করে আবার চেষ্টা করুন।');
      }
    }
    // Auto-restore active tab on refresh/page load
    document.addEventListener('DOMContentLoaded', () => {
      let savedTab = 'photo';
      try {
        savedTab = localStorage.getItem('active_studio_tab') || 'photo';
      } catch (_) {}
      if (savedTab === '3d' || savedTab === 'logo' || savedTab === 'promo' || savedTab === 'design' || savedTab === 'presentation') switchTab(savedTab);
    });
  </script>
</body>
</html>
