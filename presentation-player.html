    // ── Universal Cloud P2P & Local Remote System ────────────────────
    const GITHUB_REMOTE_URL = 'https://shakibapon1234-maker.github.io/photo-and-text-editor/remote.html';
    const CLOUD_ROOM_KEY = 'wf_pres_cloud_room_code';
    const REMOTE_SERVER_KEY = 'presentation_remote_server_host';

    function getRoomCode() {
      let code = '';
      try { code = sessionStorage.getItem(CLOUD_ROOM_KEY); } catch (_) {}
      if (!code || !code.trim()) {
        code = 'WF-' + Math.floor(1000 + Math.random() * 9000);
        try { sessionStorage.setItem(CLOUD_ROOM_KEY, code); } catch (_) {}
      }
      return code.trim().toUpperCase();
    }

    function generateNewRoomCode() {
      const code = 'WF-' + Math.floor(1000 + Math.random() * 9000);
      try { sessionStorage.setItem(CLOUD_ROOM_KEY, code); } catch (_) {}
      if (cloudPeer) {
        try { cloudPeer.destroy(); } catch (_) {}
        cloudPeer = null;
      }
      initCloudRemote();
      updateRemoteModalUI();
      return code;
    }

    function getRemoteServerHost() {
      try {
        const stored = localStorage.getItem(REMOTE_SERVER_KEY);
        if (stored && stored.trim()) return stored.trim();
      } catch (_) {}
      if (window.location.protocol !== 'file:' && window.location.host) {
        return window.location.host;
      }
      return (typeof window.__EMBEDDED_SERVER_HOST !== 'undefined' && window.__EMBEDDED_SERVER_HOST)
        ? window.__EMBEDDED_SERVER_HOST
        : '192.168.68.103:8000';
    }

    function setRemoteServerHost(newHost) {
      if (!newHost) return;
      let clean = newHost.replace(/^https?:\/\//, '').replace(/\/.*$/, '').trim();
      if (!clean.includes(':')) clean += ':8000';
      try { localStorage.setItem(REMOTE_SERVER_KEY, clean); } catch (_) {}
      return clean;
    }

    // ── WebRTC Cloud Remote Host (PeerJS) ─────────────────────────────
    let cloudPeer = null;
    let activePeerConns = [];
    let isCloudReady = false;

    function initCloudRemote() {
      if (typeof Peer === 'undefined') {
        console.warn('PeerJS library not loaded.');
        return;
      }
      if (cloudPeer && !cloudPeer.destroyed) return;

      const room = getRoomCode();
      const hostPeerId = 'wf-pres-' + room.toLowerCase().replace(/[^a-z0-9]/g, '');

      try {
        cloudPeer = new Peer(hostPeerId, { debug: 0 });

        cloudPeer.on('open', (id) => {
          isCloudReady = true;
          console.log('✅ Cloud Remote Host ready. Room:', room, 'PeerID:', id);
          updateRemoteModalUI();
        });

        cloudPeer.on('connection', (conn) => {
          activePeerConns.push(conn);
          showVoiceToast('📱 Mobile Remote Connected! (' + room + ')', 'success', 3000);
          updateRemoteModalUI();

          function executeRemoteAction(action) {
            const aiActive = isAIAssistantEnabled();
            if (action === 'next') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {
                window.PresentationAIAssistant.animatedFlyToAction('#nextBtn, .next-btn, #stage', '✨ Next ▶', 'Next!', () => advanceNext());
              } else {
                advanceNext();
              }
            } else if (action === 'prev') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {
                window.PresentationAIAssistant.animatedFlyToAction('#prevBtn, .prev-btn', '◀ Previous', 'Back!', () => advancePrev());
              } else {
                advancePrev();
              }
            } else if (action === 'nextSlide') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {
                window.PresentationAIAssistant.animatedFlyToAction('#stage', '⏭ Next Slide', 'Next slide!', () => advanceSlide(1));
              } else {
                advanceSlide(1);
              }
            } else if (action === 'prevSlide') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {
                window.PresentationAIAssistant.animatedFlyToAction('#stage', '⏮ Previous Slide', 'Previous slide!', () => advanceSlide(-1));
              } else {
                advanceSlide(-1);
              }
            } else if (action === 'fullscreen') {
              document.getElementById('fsBtn').click();
            }
            showVoiceToast('Remote: ' + String(action).toUpperCase(), 'info', 2000);
          }

          conn.on('data', (data) => {
            if (data && data.action) {
              executeRemoteAction(data.action);
            }
          });

          conn.on('close', () => {
            activePeerConns = activePeerConns.filter(c => c !== conn);
            updateRemoteModalUI();
          });
        });

        cloudPeer.on('error', (err) => {
          console.warn('Cloud Peer error:', err);
          if (err.type === 'unavailable-id') {
            generateNewRoomCode();
          }
        });
      } catch (e) {
        console.warn('Cloud Peer init exception:', e);
      }
    }

    // Initialize cloud remote listener on page load
    setTimeout(initCloudRemote, 300);

    // ── Local Server Poll Fallback ────────────────────────────────────
    let lastExecutedCmdId = 0;
    setInterval(async () => {
      try {
        const sHost = getRemoteServerHost();
        const pollUrl = (window.location.protocol === 'file:')
          ? 'http://' + sHost + '/api/remote-poll?t=' + Date.now()
          : '/api/remote-poll?t=' + Date.now();
        const res = await fetch(pollUrl, { signal: AbortSignal.timeout(1200) });
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.command && data.command.id && String(data.command.id) !== String(lastExecutedCmdId)) {
          if (lastExecutedCmdId === 0) { lastExecutedCmdId = data.command.id; return; }
          lastExecutedCmdId = data.command.id;
          const cmd = data.command;
          if (cmd && cmd.action) {
            const aiActive = isAIAssistantEnabled();
            if (cmd.action === 'next') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {

              } else {
                advanceNext();
              }
            } else if (cmd.action === 'prev') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {
                window.PresentationAIAssistant.animatedFlyToAction('#prevBtn, .prev-btn', '◀ Previous', 'Back!', () => advancePrev());
              } else {
                advancePrev();
              }
            } else if (cmd.action === 'nextSlide') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {
                window.PresentationAIAssistant.animatedFlyToAction('#stage', '⏭ Next Slide', 'Next slide!', () => advanceSlide(1));
              } else {

              }
            } else if (cmd.action === 'prevSlide') {
              if (aiActive && window.PresentationAIAssistant && window.PresentationAIAssistant.animatedFlyToAction) {

            } else if (cmd.action === 'fullscreen') {

            }
            showVoiceToast('Remote: ' + String(cmd.action).toUpperCase(), 'info', 2000);
          }
        }
      } catch (_) {}
    }, 200);

    // ── AI Assistant Management (Enable / Disable) ────────────────────
    function isAIAssistantEnabled() {
      try {
        const val = localStorage.getItem('presentation_ai_doll_enabled');
        if (val !== null) return val === 'true';
      } catch (_) {}
      return true;
    }

    function syncAIAssistantUI() {
      const enabled = isAIAssistantEnabled();
      const container = document.getElementById('ai-avatar-container');
      const toggleBtn = document.getElementById('aiToggleBtn');
      if (container) {
        if (enabled) {
          container.classList.remove('hidden-doll');
          container.style.display = 'flex';
        } else {
          container.classList.add('hidden-doll');
          container.style.display = 'none';
        }
      }
      if (toggleBtn) {
        if (enabled) {
          toggleBtn.classList.remove('disabled');
          toggleBtn.title = "AI Assistant Doll: Active (Click or press 'A' to Disable)";
        } else {
          toggleBtn.classList.add('disabled');
          toggleBtn.title = "AI Assistant Doll: Disabled (Click or press 'A' to Enable)";
        }
      }
    }

    function toggleAIAssistant(forceState) {
      const current = isAIAssistantEnabled();
      const next = typeof forceState === 'boolean' ? forceState : !current;
      try {
        localStorage.setItem('presentation_ai_doll_enabled', next ? 'true' : 'false');
      } catch (_) {}

      syncAIAssistantUI();

      if (next) {
        showVoiceToast('🧚 AI Assistant Enabled', 'success', 2200);
        if (window.PresentationAIAssistant && window.PresentationAIAssistant.showBubble) {
          window.PresentationAIAssistant.showBubble('✨ Hello! AI Assistant is active.', 2500);
        }
      } else {
        if (window.PresentationAIAssistant && window.PresentationAIAssistant.stopListening) {
          window.PresentationAIAssistant.stopListening();
        }
        if (typeof window.speechSynthesis !== 'undefined') {
          window.speechSynthesis.cancel();
        }
        showVoiceToast('🧚 AI Assistant Disabled', 'info', 2200);
      }
      return next;
    }
    window.isAIAssistantEnabled = isAIAssistantEnabled;
    window.toggleAIAssistant = toggleAIAssistant;
    setTimeout(syncAIAssistantUI, 500);

    // ── Mobile Remote Modal UI Helper ─────────────────────────────────
    function getCloudRemoteUrl() {
      const room = getRoomCode();
      return GITHUB_REMOTE_URL + '?room=' + encodeURIComponent(room);
    }

    function updateRemoteModalUI() {
      const modal = document.getElementById('remoteModal');
      if (!modal) return;

      const room = getRoomCode();
      const cloudUrl = getCloudRemoteUrl();

      const badge = document.getElementById('cloudStatusBadge');
      if (badge) {
        if (activePeerConns.length > 0) {
          badge.innerHTML = '🟢 <strong>' + activePeerConns.length + ' Mobile Connected</strong> (Room: ' + room + ')';
          badge.style.background = '#065f46';
          badge.style.color = '#34d399';
        } else if (isCloudReady) {
          badge.innerHTML = '🟢 <strong>Cloud Remote Active</strong> (Room: ' + room + ')';
          badge.style.background = '#064e3b';
          badge.style.color = '#34d399';
        } else {
          badge.innerHTML = '🟡 <strong>Connecting to Cloud...</strong> (Room: ' + room + ')';
          badge.style.background = '#78350f';
          badge.style.color = '#fde68a';
        }
      }

      const linkEl = document.getElementById('remoteUrlLink');
      if (linkEl) {
        linkEl.href = cloudUrl;
        linkEl.textContent = cloudUrl;
      }

      const directBtn = document.getElementById('openRemoteDirectBtn');
      if (directBtn) {
        directBtn.onclick = () => window.open(cloudUrl, '_blank');
      }

      const qrEl = document.getElementById('qrImg');
      if (qrEl) {
        qrEl.onerror = function() {
          this.parentElement.innerHTML = '<div style="padding:15px;color:#dc2626;font-size:12px;text-align:center">QR load failed.<br>Click the direct link below.</div>';
        };
        qrEl.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&ecc=M&data=' + encodeURIComponent(cloudUrl);
      }
    }

    // ── Mobile Remote Modal Trigger ───────────────────────────────────
    document.getElementById('remoteBtn').addEventListener('click', () => {
      const oldModal = document.getElementById('remoteModal');
      if (oldModal) { oldModal.remove(); return; }

      if (!isCloudReady) initCloudRemote();

      const modal = document.createElement('div');
      modal.id = 'remoteModal';
      modal.className = 'remote-modal-backdrop';
      modal.innerHTML = [
        '<div class="remote-modal-card" style="max-width:440px;width:92%;">',
          '<div class="remote-modal-head">',
            '<span style="font-size:16px;font-weight:800;color:#fff;">📱 Universal Mobile Remote</span>',
            '<button class="remote-modal-close" id="rmClose">&#x2715;</button>',
          '</div>',

          '<div id="cloudStatusBadge" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 14px;border-radius:20px;background:#064e3b;color:#34d399;margin:8px 0 10px;">',
            '🟢 Cloud Remote Active (Room: ' + getRoomCode() + ')',
          '</div>',

          '<p style="font-size:12px;color:#94a3b8;margin:0 0 12px;line-height:1.4;">',
            '✨ কোনো আইপি বা সার্ভার লাগবে না! মোবাইল যে কোনো ওয়াইফাই বা ৪জি/৫জি দিয়ে স্ক্যান করলেই কাজ করবে।',
          '</p>',

          '<!-- One-Click Direct Open Button -->',
          '<div style="margin-bottom:12px;">',
            '<button id="openRemoteDirectBtn" style="width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg, #10b981, #059669);border:none;color:#fff;font-size:14px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(16,185,129,0.35);transition:transform 0.15s;">',
              '<span>🌐</span> Open Online Remote in Browser',
            '</button>',
          '</div>',

          '<!-- QR Code -->',
          '<div style="background:#fff;padding:12px;border-radius:14px;display:inline-block;margin:0 0 12px;box-shadow:0 8px 24px rgba(0,0,0,0.5);">',
            '<img id="qrImg" src="" alt="QR" width="180" height="180" style="display:block;">',
          '</div>',

          '<!-- Clickable Direct Link -->',
          '<div style="background:#0f172a;border:1.5px solid #10b981;border-radius:12px;padding:10px 12px;margin-bottom:12px;text-align:left;">',
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">',
              '<span style="font-size:11px;color:#94a3b8;font-weight:700;">Direct Online Remote Link:</span>',
              '<span style="font-size:11px;color:#34d399;font-weight:800;">Click to Open ↗</span>',
            '</div>',
            '<a id="remoteUrlLink" href="#" target="_blank" style="color:#38bdf8;font-weight:800;font-size:12px;word-break:break-all;text-decoration:none;display:block;">Loading...</a>',
          '</div>',

          '<!-- Action Buttons -->',
          '<div style="display:flex;gap:8px;margin-bottom:8px;">',
            '<button id="copyBtn" style="flex:1;padding:10px;border-radius:10px;background:#1d4ed8;border:none;color:#fff;font-size:13px;font-weight:800;cursor:pointer;">📋 Copy Link</button>',
            '<button id="newRoomBtn" style="padding:10px 14px;border-radius:10px;background:#334155;border:none;color:#fff;font-size:13px;font-weight:800;cursor:pointer;" title="Generate New Room Code">🔄 New Room</button>',
            '<button id="toggleLocalBtn" style="padding:10px 12px;border-radius:10px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;" title="Toggle Local IP fallback">⚙️ Local IP</button>',
          '</div>',

          '<!-- Collapsible Offline Local Server Fallback -->',
          '<div id="localServerSection" style="display:none;background:#1e293b;border-radius:10px;padding:10px;margin-top:10px;text-align:left;border:1px solid #334155;">',
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">',
              '<span style="font-size:11px;color:#cbd5e1;font-weight:700;">Offline Local IP (Optional):</span>',
              '<button id="editIpBtn" style="background:none;border:none;color:#38bdf8;font-size:11px;font-weight:800;cursor:pointer;">✏️ Edit</button>',
            '</div>',
            '<div id="localIpText" style="font-size:12px;color:#94a3b8;font-family:monospace;word-break:break-all;">Loading...</div>',
          '</div>',
        '</div>'
      ].join('');
      document.body.appendChild(modal);

      // Wire close
      document.getElementById('rmClose').onclick = () => modal.remove();

      // Wire Copy button
      document.getElementById('copyBtn').onclick = () => {
        const link = getCloudRemoteUrl();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(link).then(() => {
            const b = document.getElementById('copyBtn');
            if (b) {
              b.textContent = 'Copied!';
              b.style.background = '#059669';
              setTimeout(() => { b.textContent = '📋 Copy Link'; b.style.background = '#1d4ed8'; }, 2000);
            }
          });
        }
      };

      // Wire New Room button
      document.getElementById('newRoomBtn').onclick = () => {
        generateNewRoomCode();
        showVoiceToast('New Room Generated: ' + getRoomCode(), 'info', 2000);
      };

      // Wire Local IP Toggle
      document.getElementById('toggleLocalBtn').onclick = () => {
        const sec = document.getElementById('localServerSection');
        if (sec) sec.style.display = (sec.style.display === 'none' ? 'block' : 'none');
        const sHost = getRemoteServerHost();
        const lText = document.getElementById('localIpText');
        if (lText) lText.textContent = 'http://' + sHost + '/remote.html';
      };

      // Wire Edit Local IP
      document.getElementById('editIpBtn').onclick = () => {
        const currentHost = getRemoteServerHost();
        const entered = prompt('Enter the Server PC IP address (e.g. 192.168.68.103:8000):', currentHost);
        if (entered && entered.trim()) {
          setRemoteServerHost(entered.trim());
          const lText = document.getElementById('localIpText');
          if (lText) lText.textContent = 'http://' + getRemoteServerHost() + '/remote.html';
          showVoiceToast('Local IP updated: ' + getRemoteServerHost(), 'info', 2000);
        }
      };

      updateRemoteModalUI();
    });

    // ── Player Keyboard Shortcuts Modal ────────────────────────────────
    function togglePlayerShortcuts(forceOpen) {
      let modal = document.getElementById('playerShortcutsModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'playerShortcutsModal';
        modal.className = 'remote-modal-backdrop';
        modal.innerHTML = [
          '<div class="remote-modal-card" style="max-width:540px;text-align:left;">',
            '<div class="remote-modal-head" style="margin-bottom:12px;">',
              '<span>⌨️ Presentation Player Shortcuts</span>',
              '<button class="remote-modal-close" id="scClose">&#x2715;</button>',
            '</div>',
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;max-height:70vh;overflow-y:auto;padding-right:4px;">',
              '<div>',
                '<strong style="color:#38bdf8;display:block;margin-bottom:6px;">NAVIGATION (স্লাইড কন্ট্রোল)</strong>',
                '<div style="padding:4px 0;">Next Step / Slide: <strong style="color:#ffd166;">→ / Space / Enter</strong></div>',
                '<div style="padding:4px 0;">Prev Step / Slide: <strong style="color:#ffd166;">← / Backspace</strong></div>',
                '<div style="padding:4px 0;">Next Slide (Direct): <strong style="color:#ffd166;">PageDown / N</strong></div>',
                '<div style="padding:4px 0;">Prev Slide (Direct): <strong style="color:#ffd166;">PageUp / P</strong></div>',
                '<div style="padding:4px 0;">First Slide: <strong style="color:#ffd166;">Home</strong></div>',
                '<div style="padding:4px 0;">Last Slide: <strong style="color:#ffd166;">End</strong></div>',
                '<div style="padding:4px 0;">Fullscreen: <strong style="color:#ffd166;">F / F11</strong></div>',
              '</div>',
              '<div>',
                '<strong style="color:#38bdf8;display:block;margin-bottom:6px;">FEATURES & AUDIO (ফিচার)</strong>',
                '<div style="padding:4px 0;">AI Assistant (Doll On/Off): <strong style="color:#ffd166;">A</strong></div>',
                '<div style="padding:4px 0;">Voice Mic: <strong style="color:#ffd166;">V</strong></div>',
                '<div style="padding:4px 0;">Mute / Unmute: <strong style="color:#ffd166;">M</strong></div>',
                '<div style="padding:4px 0;">Volume Up / Down: <strong style="color:#ffd166;">+ / -</strong></div>',
                '<div style="padding:4px 0;">Slide List Drawer: <strong style="color:#ffd166;">L</strong></div>',
                '<div style="padding:4px 0;">Close / Exit: <strong style="color:#ffd166;">Esc</strong></div>',
              '</div>',
            '</div>',
            '<div style="margin-top:14px;text-align:center;">',
              '<button id="scOkBtn" style="padding:8px 24px;border-radius:8px;background:#1d4ed8;border:none;color:#fff;font-weight:700;cursor:pointer;">ঠিক আছে (OK)</button>',
            '</div>',
          '</div>'
        ].join('');
        document.body.appendChild(modal);
        document.getElementById('scClose').onclick = () => modal.remove();
        document.getElementById('scOkBtn').onclick = () => modal.remove();
        modal.onclick = e => { if (e.target === modal) modal.remove(); };
        return;
      }
      if (forceOpen === false) modal.remove();
      else modal.remove();
    }

    const scBtn = document.getElementById('shortcutsBtn');
    if (scBtn) scBtn.onclick = () => togglePlayerShortcuts();

    const aiToggleBtn = document.getElementById('aiToggleBtn');
    if (aiToggleBtn) aiToggleBtn.onclick = () => toggleAIAssistant();

    window.addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
      if (e.key === '?' || e.key === 'F1') {
        e.preventDefault();
        togglePlayerShortcuts();
      }
      if (e.key === 'a' || e.key === 'A') {
        toggleAIAssistant();
      }
      if (e.key === 'PageDown' || e.key === 'n' || e.key === 'N') {
        advanceSlide(1);
      }
      if (e.key === 'PageUp' || e.key === 'p' || e.key === 'P') {
        advanceSlide(-1);
      }
      if (e.key === 'Escape') {
        document.getElementById('playerShortcutsModal')?.remove();
        document.getElementById('remoteModal')?.remove();
      }
    });

    // ── Built-in Soundtrack Engine ─────────────────────────────────────
    let presentationAudio = null;
    let soundtrackVolume = 0.6;
    let soundtrackLoop = true;
    let isSoundtrackMuted = false;
    let lastNonZeroSoundtrackVol = 0.6;

    function initSoundtrackEngine(audioSrc, volume = 60, loop = true, name = '') {
      const ctrl = document.getElementById('soundtrackControls');
      if (!audioSrc) {
        if (ctrl) {
          ctrl.classList.add('no-audio');
          ctrl.title = 'No soundtrack embedded in this presentation';
        }
        return;
      }
      if (ctrl) {
        ctrl.classList.remove('no-audio');
        ctrl.style.display = 'inline-flex';
      }
      soundtrackVolume = (volume != null ? Number(volume) : 60) / 100;
      soundtrackLoop = loop !== false;
      lastNonZeroSoundtrackVol = soundtrackVolume > 0 ? soundtrackVolume : 0.6;
      isSoundtrackMuted = false;

      try {
        if (!presentationAudio) {
          presentationAudio = new Audio();
          window._presentationAudio = presentationAudio;

          presentationAudio.addEventListener('play', updateSoundtrackUi);
          presentationAudio.addEventListener('playing', updateSoundtrackUi);
          presentationAudio.addEventListener('pause', updateSoundtrackUi);
          presentationAudio.addEventListener('volumechange', updateSoundtrackUi);
          presentationAudio.addEventListener('canplaythrough', () => {
            if (!isSoundtrackMuted && soundtrackVolume > 0 && presentationAudio.paused) {
              presentationAudio.play().catch(() => {});
            }
          });
        }
        presentationAudio.src = audioSrc;
        presentationAudio.volume = soundtrackVolume;
        presentationAudio.loop = soundtrackLoop;
        presentationAudio.preload = 'auto';

        // Attempt playback immediately
        presentationAudio.play().catch(() => {
          console.log('[Soundtrack] Autoplay blocked by browser policy. Will start on first user interaction.');
        });
      } catch (e) {
        console.warn('Soundtrack init error:', e);
      }

      updateSoundtrackUi();
    }

    function setSoundtrackVolume(pct) {
      const val = Math.max(0, Math.min(100, Math.round(pct)));
      if (val === 0) {
        isSoundtrackMuted = true;
      } else {
        isSoundtrackMuted = false;
        soundtrackVolume = val / 100;
        lastNonZeroSoundtrackVol = soundtrackVolume;
      }

      if (presentationAudio) {
        presentationAudio.volume = isSoundtrackMuted ? 0 : soundtrackVolume;
        if (!isSoundtrackMuted && presentationAudio.paused) {
          presentationAudio.play().catch(() => {});
        }
      }
      updateSoundtrackUi();
    }

    function toggleSoundtrackMute() {
      if (!presentationAudio) return;
      if (isSoundtrackMuted || soundtrackVolume === 0) {
        // UNMUTE
        isSoundtrackMuted = false;
        if (soundtrackVolume === 0) {
          soundtrackVolume = lastNonZeroSoundtrackVol > 0 ? lastNonZeroSoundtrackVol : 0.6;
        }
        presentationAudio.volume = soundtrackVolume;
        if (presentationAudio.paused) {
          presentationAudio.play().catch(() => {});
        }
      } else {
        // MUTE
        isSoundtrackMuted = true;
        presentationAudio.volume = 0;
      }
      updateSoundtrackUi();
    }

    function updateSoundtrackUi() {
      const btn = document.getElementById('soundtrackToggleBtn');
      const slider = document.getElementById('soundtrackVolumeSlider');
      const badge = document.getElementById('soundtrackVolBadge');

      const isMuted = isSoundtrackMuted || soundtrackVolume === 0;
      const displayPct = isMuted ? 0 : Math.round(soundtrackVolume * 100);

      if (slider) slider.value = displayPct;
      if (badge) badge.textContent = displayPct + '%';

      if (btn) {
        if (isMuted) {
          btn.innerHTML = '🔇';
          btn.title = 'Unmute Soundtrack (Click or press M)';
          btn.style.background = '#334155';
          btn.style.borderColor = '#64748b';
        } else if (soundtrackVolume < 0.45) {
          btn.innerHTML = '🔉';
          btn.title = 'Soundtrack (' + displayPct + '%) • Click to mute (M)';
          btn.style.background = '#be185d';
          btn.style.borderColor = '#f472b6';
        } else {
          btn.innerHTML = '🔊';
          btn.title = 'Soundtrack (' + displayPct + '%) • Click to mute (M)';
          btn.style.background = '#be185d';
          btn.style.borderColor = '#f472b6';
        }
      }
    }

    function unlockSoundtrackOnGesture() {
      if (!presentationAudio) return;
      if (!isSoundtrackMuted && soundtrackVolume > 0 && presentationAudio.paused) {
        presentationAudio.play().then(() => {
          updateSoundtrackUi();
        }).catch(() => {});
      }
    }
    ['pointerdown', 'click', 'touchstart', 'keydown'].forEach(evt => {
      window.addEventListener(evt, unlockSoundtrackOnGesture, { passive: true });
    });

    window.addEventListener('keydown', (e) => {
      unlockSoundtrackOnGesture();
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleSoundtrackMute();
      } else if (e.key === '+' || e.key === '=' || e.key === ']') {
        e.preventDefault();
        setSoundtrackVolume(Math.round(soundtrackVolume * 100) + 5);
      } else if (e.key === '-' || e.key === '_' || e.key === '[') {
        e.preventDefault();
        setSoundtrackVolume(Math.round(soundtrackVolume * 100) - 5);
      }
    });

    document.getElementById('soundtrackToggleBtn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSoundtrackMute();
    });

    const vSlider = document.getElementById('soundtrackVolumeSlider');
    if (vSlider) {
      vSlider.addEventListener('input', (e) => {
        setSoundtrackVolume(e.target.value);
      });
      vSlider.addEventListener('change', (e) => {
        setSoundtrackVolume(e.target.value);
        unlockSoundtrackOnGesture();
      });
    }

    // ── Auto Initialization if Slides Preloaded ─────────────────────────────
    if (Array.isArray(slides) && slides.length > 0) {
      currentIndex = 0;
      currentStepIdx = 0;
      const dropzone = document.getElementById('dropzone');
      if (dropzone) dropzone.classList.add('hidden');
      renderDrawer();
      drawSlide();
    }
  </script>
  <script src="presentation-ai-assistant.js"></script>
