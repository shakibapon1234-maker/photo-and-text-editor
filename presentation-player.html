<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Player — Projector & Display</title>
  <!-- PeerJS for Zero-Config Cloud WebRTC Mobile Remote Control -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #060913; color: #fff;
      font-family: 'Outfit', 'Inter', Arial, 'Noto Sans Bengali', system-ui, sans-serif;
      overflow: hidden; user-select: none;
    }

    /* ── Dropzone / Start Screen ────────────────────────────────────────── */
    #dropzone {
      position: fixed; inset: 0; z-index: 1000;
      background: radial-gradient(circle at center, #152238 0%, #080d1a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    #dropzone.hidden { display: none; }
    .drop-card {
      position: relative;
      max-width: 520px; width: 100%; padding: 36px 28px;
      background: rgba(23, 35, 60, 0.75);
      border: 2px dashed #4f8df7; border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      backdrop-filter: blur(14px);
      transition: transform 0.2s, border-color 0.2s;
    }
    .drop-card-close {
      position: absolute; top: 14px; right: 14px;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
      z-index: 10;
    }
    .drop-card-close:hover {
      background: rgba(239, 68, 68, 0.85);
      border-color: #ef4444;
      transform: scale(1.1);
    }
    .drop-card.drag-over { transform: scale(1.02); border-color: #ffd166; background: rgba(35, 55, 90, 0.85); }
    .drop-icon { font-size: 48px; margin-bottom: 12px; }
    .drop-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .drop-desc { font-size: 14px; color: #9bb0d3; line-height: 1.5; margin-bottom: 22px; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; font-size: 14px; font-weight: 700;
      border-radius: 8px; border: 1px solid #4f8df7;
      background: #1769e8; color: #fff; cursor: pointer;
      transition: all 0.15s ease; text-decoration: none;
    }
    .btn:hover { background: #1b74ff; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(23, 105, 232, 0.4); }
    .btn-secondary { background: #22334d; border-color: #6079a3; }
    .btn-secondary:hover { background: #2c4263; border-color: #8da6d0; }
    input[type="file"] { display: none; }

    /* ── Viewport Stage (16:9 scaled) ─────────────────────────────────── */
    #stageContainer {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    #stage {
      position: relative;
      width: 960px; height: 540px;
      transform-origin: center center;
      transform: scale(var(--pres-scale, 1));
      background: #17233c; overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    /* ── Background Media & B-Roll ────────────────────────────────────── */
    .bg-media {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0; pointer-events: none;
      transform: translateZ(0);
    }
    .bg-overlay {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
    }
    /* ── High Quality Animated B-Roll & Background Presets ── */
    #brollLayer {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
      transform: translateZ(0);
    }
    #brollLayer:before, #brollLayer:after {
      content: "" !important;
      position: absolute !important;
      inset: -50% !important;
      width: 200% !important;
      height: 200% !important;
      display: block !important;
      background-repeat: repeat !important;
      will-change: transform;
      pointer-events: none !important;
    }
    #brollLayer.space {
      background: radial-gradient(circle at 70% 25%, #ffd166 0%, #ff8c00 1.5%, transparent 4%),
                  radial-gradient(circle at 20% 80%, #6366f1 0%, #312e81 8%, transparent 20%),
                  radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%) !important;
    }
    #brollLayer.space:before {
      background-image: radial-gradient(circle, #ffffff 1px, transparent 1.5px), radial-gradient(circle, #93c5fd 1.5px, transparent 2px) !important;
      background-size: 60px 60px, 110px 110px !important;
      background-position: 0 0, 30px 30px !important;
      animation: broll_space_drift 25s linear infinite !important;
    }
    #brollLayer.space:after {
      background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(139, 92, 246, 0.35) 45%, transparent 55%),
                  radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.25) 0%, transparent 40%) !important;
      animation: broll_space_pulse 16s ease-in-out infinite alternate !important;
    }
    @keyframes broll_space_drift {
      from { transform: rotate(0deg) translate3d(0, 0, 0); }
      to { transform: rotate(360deg) translate3d(-30px, -30px, 0); }
    }
    @keyframes broll_space_pulse {
      0% { transform: scale(0.9) rotate(0deg); opacity: 0.6; }
      50% { transform: scale(1.1) rotate(15deg); opacity: 0.9; }
      100% { transform: scale(0.95) rotate(-10deg); opacity: 0.7; }
    }

    #brollLayer.aurora {
      background: #020617 !important;
    }
    #brollLayer.aurora:before {
      background: radial-gradient(ellipse at 20% 80%, rgba(16, 185, 129, 0.65) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 30%, rgba(56, 189, 248, 0.7) 0%, transparent 55%),
                  radial-gradient(ellipse at 90% 70%, rgba(168, 85, 247, 0.6) 0%, transparent 50%) !important;
      filter: blur(25px) !important;
      animation: broll_aurora_wave 10s ease-in-out infinite alternate !important;
    }
    #brollLayer.aurora:after {
      background: radial-gradient(ellipse at 50% 20%, rgba(244, 114, 182, 0.4) 0%, transparent 45%),
                  radial-gradient(ellipse at 40% 90%, rgba(34, 197, 94, 0.5) 0%, transparent 50%) !important;
      filter: blur(35px) !important;
      animation: broll_aurora_shift 14s ease-in-out infinite alternate !important;
    }
    @keyframes broll_aurora_wave {
      0% { transform: translate3d(-5%, -5%, 0) scale(1); opacity: 0.7; }
      100% { transform: translate3d(8%, 8%, 0) scale(1.15); opacity: 1; }
    }
    @keyframes broll_aurora_shift {
      0% { transform: translate3d(6%, -8%, 0) rotate(5deg); }
      100% { transform: translate3d(-6%, 6%, 0) rotate(-5deg); }
    }

    #brollLayer.sky {
      background: linear-gradient(165deg, #0284c7, #38bdf8 45%, #bae6fd) !important;
    }
    #brollLayer.sky:before {
      background: radial-gradient(ellipse at 15% 35%, #fff 0 10%, transparent 28%),
                  radial-gradient(ellipse at 55% 65%, rgba(255,255,255,0.9) 0 12%, transparent 30%),
                  radial-gradient(ellipse at 88% 25%, #fff 0 10%, transparent 28%) !important;
      filter: blur(8px) !important;
      animation: broll_clouds 22s linear infinite !important;
    }
    #brollLayer.sky:after {
      inset: auto 20% 40% auto !important;
      width: 48px !important;
      height: 16px !important;
      background: #fff !important;
      clip-path: polygon(0 45%,60% 43%,90% 0,100% 0,75% 47%,100% 75%,100% 90%,60% 59%,0 59%) !important;
      animation: broll_plane 12s linear infinite !important;
    }
    @keyframes broll_clouds {
      0% { transform: translate3d(-20%, 0, 0); }
      100% { transform: translate3d(20%, 0, 0); }
    }
    @keyframes broll_plane {
      from { transform: translate3d(-80vw, 35vh, 0) scale(0.8); }
      to { transform: translate3d(60vw, -30vh, 0) scale(1.2); }
    }

    #brollLayer.night {
      background: linear-gradient(155deg, #020617, #0f172a 60%, #1e1b4b) !important;
    }
    #brollLayer.night:before {
      background-image: radial-gradient(#fde047 0.8px, transparent 1.2px), radial-gradient(#ffffff 1px, transparent 1.5px) !important;
      background-size: 40px 40px, 90px 90px !important;
      animation: broll_stars_twinkle 15s linear infinite !important;
    }
    #brollLayer.night:after {
      inset: auto -10% 0 !important;
      height: 45% !important;
      background: repeating-linear-gradient(90deg, #090d16 0 25px, #131d2e 26px 45px, #090d16 46px 65px) !important;
      clip-path: polygon(0 32%,8% 17%,16% 37%,23% 5%,32% 25%,41% 12%,49% 35%,60% 4%,70% 30%,79% 10%,89% 32%,100% 13%,100% 100%,0 100%) !important;
      animation: broll_city_pan 12s linear infinite alternate !important;
    }
    @keyframes broll_stars_twinkle {
      0% { transform: translate3d(0, 0, 0); opacity: 0.7; }
      50% { opacity: 1; }
      100% { transform: translate3d(-5%, -5%, 0); opacity: 0.8; }
    }
    @keyframes broll_city_pan {
      0% { transform: translate3d(-4%, 0, 0); }
      100% { transform: translate3d(4%, 0, 0); }
    }

    #brollLayer.sunset, #brollLayer.cloudSunset {
      background: linear-gradient(175deg, #4c0519, #be123c 35%, #f97316 65%, #fde047 90%) !important;
    }
    #brollLayer.sunset:before, #brollLayer.cloudSunset:before {
      background: radial-gradient(ellipse at 15% 70%, #ffc76c 0 10%, transparent 28%),
                  radial-gradient(ellipse at 50% 75%, #ffedd5 0 8%, transparent 22%),
                  radial-gradient(ellipse at 85% 55%, #fed7aa 0 10%, transparent 30%) !important;
      filter: blur(12px) !important;
      animation: broll_sunset_clouds 18s linear infinite alternate !important;
    }
    #brollLayer.sunset:after, #brollLayer.cloudSunset:after {
      display: none;
    }
    @keyframes broll_sunset_clouds {
      0% { transform: translate3d(-6%, 0, 0) scale(1); }
      100% { transform: translate3d(6%, -2%, 0) scale(1.05); }
    }

    #brollLayer.water {
      background: linear-gradient(180deg, #0369a1, #0284c7 45%, #075985) !important;
    }
    #brollLayer.water:before {
      background: repeating-radial-gradient(ellipse at 50% 105%, rgba(186, 230, 253, 0.4) 0 1px, transparent 2px 16px) !important;
      transform-origin: 50% 100% !important;
      animation: broll_water_ripple 6s ease-in-out infinite alternate !important;
    }
    #brollLayer.water:after {
      background: linear-gradient(110deg, transparent 35%, rgba(224, 242, 254, 0.3) 48%, transparent 58%) !important;
      animation: broll_water_shimmer 6s linear infinite !important;
    }
    @keyframes broll_water_ripple {
      0% { transform: scale(1, 1); }
      100% { transform: scale(1.15, 1.08) translate3d(0, -3%, 0); }
    }
    @keyframes broll_water_shimmer {
      from { transform: translate3d(-70%, 0, 0); }
      to { transform: translate3d(70%, 0, 0); }
    }

    .speed-slow:before, .speed-slow:after { animation-duration: 40s !important; }
    .speed-fast:before, .speed-fast:after { animation-duration: 8s !important; }
    .element {
      position: absolute;
      line-height: 1.2;
      box-sizing: border-box;
      animation-fill-mode: both;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      transform-origin: center center;
    }
    .element.image-el { overflow: hidden; background: transparent; }
    .element.image-el img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .element.image-el.fit-cover img { object-fit: cover; }
    .element.video-el { overflow: hidden; background: transparent; }
    .element.video-el video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .element.video-el.key-black video { mix-blend-mode: screen; }
    .element.video-el.key-light video { mix-blend-mode: multiply; }
    .element.shape-el { background: transparent !important; overflow: visible !important; }
    .element.shape-el .shape-body { position: absolute; inset: 0; pointer-events: none; }
    .element.shape-el .shape-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow: hidden; word-break: break-word;
      overflow-wrap: break-word;
      line-height: 1.25; z-index: 2;
      padding: 10px 14px; box-sizing: border-box;
    }
    .element.table-el { background: #fff; color: #17223a; overflow: hidden; }
    .element.table-el table { border-collapse: collapse; width: 100%; height: 100%; table-layout: fixed; }
    .element.table-el td { border: 1px solid #98a6bd; padding: 4px; font-size: inherit; vertical-align: middle; word-break: break-word; }
    .element.table-el tr:first-child td { background: #4f8df7; color: #fff; font-weight: 700; }

    /* ── Floating Controls Bar ────────────────────────────────────────── */
    #controls {
      position: fixed; z-index: 200;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; border-radius: 40px;
      background: rgba(10, 16, 30, 0.85);
      border: 1px solid rgba(80, 120, 180, 0.35);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      opacity: 0.88; transition: opacity 0.3s ease;
    }
    body:hover #controls, #controls:hover { opacity: 1; }
    .ctrl-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 50%;
      background: #1c2b42; border: 1px solid #4a6288;
      color: #fff; font-size: 16px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover { background: #2d456b; border-color: #79abff; transform: scale(1.08); }
    .ctrl-btn.voice-on {
      background: #dc2626 !important;
      border-color: #f87171 !important;
      box-shadow: 0 0 14px rgba(220, 38, 38, 0.8) !important;
      animation: voicePulse 1.2s infinite alternate !important;
    }
    @keyframes voicePulse {
      0% { transform: scale(1); box-shadow: 0 0 8px rgba(220, 38, 38, 0.6); }
      100% { transform: scale(1.15); box-shadow: 0 0 20px rgba(239, 68, 68, 0.9); }
    }
    .ctrl-info { font-size: 13px; color: #c4d7f5; font-weight: 700; padding: 0 6px; white-space: nowrap; }

    /* ── AI Doll Toggle Button ── */
    #aiToggleBtn {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border-color: #f472e8;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.45);
      position: relative;
    }
    #aiToggleBtn:hover {
      background: linear-gradient(135deg, #c084fc, #f472b6);
      border-color: #fff;
      transform: scale(1.1);
      box-shadow: 0 0 18px rgba(236, 72, 153, 0.8);
    }
    #aiToggleBtn.disabled {
      background: #1c2b42 !important;
      border-color: #4a6288 !important;
      opacity: 0.42 !important;
      filter: grayscale(1) !important;
      box-shadow: none !important;
    }

    /* ── Soundtrack Controls in Player Toolbar ── */
    .soundtrack-ctrl-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 3px 12px 3px 4px;
      border-radius: 30px;
      background: rgba(23, 37, 84, 0.7);
      border: 1px solid rgba(244, 114, 182, 0.45);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .soundtrack-ctrl-group:hover {
      border-color: #f472b6;
      background: rgba(30, 48, 100, 0.85);
    }
    .soundtrack-ctrl-group.no-audio {
      opacity: 0.5;
      filter: grayscale(0.8);
    }
    #soundtrackToggleBtn {
      width: 32px;
      height: 32px;
      background: #be185d;
      border-color: #f472b6;
      font-size: 14px;
    }
    #soundtrackToggleBtn:hover {
      background: #db2777;
      border-color: #fbcfe8;
    }
    #soundtrackVolumeSlider {
      width: 75px;
      height: 5px;
      appearance: none;
      -webkit-appearance: none;
      background: #334155;
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }
    #soundtrackVolumeSlider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f472b6;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(244, 114, 182, 0.9);
      transition: transform 0.15s;
    }
    #soundtrackVolumeSlider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .vol-badge {
      font-size: 11px;
      font-weight: 800;
      color: #f9a8d4;
      min-width: 32px;
      text-align: right;
    }

    /* ── Slide Quick Navigator Drawer ─────────────────────────────────── */
    #navDrawer {
      position: fixed; z-index: 300;
      top: 0; bottom: 0; right: -420px; width: 400px;
      background: rgba(8, 14, 28, 0.97);
      border-left: 1px solid #2d4063;
      box-shadow: -12px 0 45px rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      transition: right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; padding: 18px 16px;
    }
    #navDrawer.open { right: 0; }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(80, 120, 180, 0.25);
    }
    .drawer-title { font-size: 15px; font-weight: 800; color: #ffd166; letter-spacing: 0.8px; }
    .drawer-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.15s; }
    .drawer-close:hover { background: rgba(255,255,255,0.1); }
    .thumb-grid {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px;
    }
    .thumb-grid::-webkit-scrollbar { width: 6px; }
    .thumb-grid::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .thumb-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .thumb-grid::-webkit-scrollbar-thumb:hover { background: #4f8df7; }
    .thumb-item {
      display: flex; align-items: center; gap: 14px; padding: 10px 12px;
      background: #141f35; border: 1.5px solid #223454; border-radius: 12px;
      cursor: pointer; transition: all 0.2s ease;
      position: relative;
    }
    .thumb-item:hover { background: #1c2e50; border-color: #4f8df7; transform: translateX(-4px); }
    .thumb-item.active { border-color: #ffd166; background: #233b66; box-shadow: 0 0 18px rgba(255, 209, 102, 0.35); }
    .thumb-preview-box {
      width: 128px; height: 72px; border-radius: 6px; overflow: hidden;
      flex-shrink: 0; position: relative; background: #0f172a;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .thumb-mini-stage {
      position: absolute; top: 0; left: 0;
      width: 960px; height: 540px;
      transform: scale(0.13333333);
      transform-origin: top left;
      pointer-events: none;
      overflow: hidden;
      user-select: none;
      box-sizing: border-box;
    }
    .thumb-details { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .thumb-num-row { display: flex; align-items: center; justify-content: space-between; }
    .thumb-num { font-weight: 800; font-size: 13px; color: #79abff; }
    .thumb-item.active .thumb-num { color: #ffd166; }
    .thumb-step-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(79, 141, 247, 0.2); color: #93c5fd; font-weight: 600; }
    .thumb-label { font-size: 12px; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

    /* ── Mobile Remote Modal ─────────────────────────────────────────── */
    .remote-modal-backdrop {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(4, 8, 18, 0.85); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .remote-modal-card {
      width: 100%; max-width: 400px; background: #0f172a; border: 1px solid #334155;
      border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); padding: 24px;
      text-align: center; color: #fff;
    }
    .remote-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; font-weight: 800; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 10px;
    }
    .remote-modal-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="dropzone">
    <div class="drop-card" id="dropCard">
      <button id="closeDropzoneBtn" class="drop-card-close" title="Close (Esc)">✕</button>
      <div class="drop-icon">📽️</div>
      <h1 class="drop-title">Presentation Player</h1>
      <p class="drop-desc">
        Presentation Studio থেকে Export করা <strong>.json</strong> ফাইলটি এখানে Drop করুন অথবা নিচের বাটনে ক্লিক করে ফাইলটি ওপেন করুন।
      </p>
      <div class="btn-row">
        <label class="btn">
          📁 Load Presentation (.json)
          <input type="file" id="fileInput" accept=".json,application/json">
        </label>
        <button class="btn btn-secondary" id="demoBtn">▶ Demo Slide</button>
      </div>
    </div>
  </div>

  <div id="stageContainer">
    <div id="stage"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="prevBtn" title="Previous Slide (←)">◀</button>
    <span class="ctrl-info" id="slideInfo">1 / 1</span>
    <button class="ctrl-btn" id="nextBtn" title="Next Slide (→ / Space)">▶</button>
    <div id="soundtrackControls" class="soundtrack-ctrl-group" title="Presentation Soundtrack">
      <button class="ctrl-btn" id="soundtrackToggleBtn" title="Soundtrack: Play / Mute (M)">🔊</button>
      <input type="range" id="soundtrackVolumeSlider" min="0" max="100" value="60" title="Soundtrack Volume (+ / -)">
      <span id="soundtrackVolBadge" class="vol-badge">60%</span>
    </div>
    <button class="ctrl-btn" id="aiToggleBtn" title="AI Assistant Doll: Active (Press 'A' to Disable)">🧚</button>
    <button class="ctrl-btn" id="voiceBtn" title="Voice Control (Bengali / English)">🎤</button>
    <button class="ctrl-btn" id="remoteBtn" title="Mobile Remote Control (QR Code)">📱</button>
    <button class="ctrl-btn" id="fsBtn" title="Fullscreen (F / F11)">⛶</button>
    <button class="ctrl-btn" id="shortcutsBtn" title="Keyboard Shortcuts (⌨️ / ?)">⌨️</button>
    <button class="ctrl-btn" id="listBtn" title="Slide List (L)">☰</button>

  <div id="navDrawer">
    <div class="drawer-head">
      <span class="drawer-title">SLIDE LIST</span>
      <button class="drawer-close" id="closeDrawer">✕</button>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
  </div>

  <script>
    function getShapeSvg(shape) {
      const s = shape || 'rect';
      switch(s) {
        case 'line':
          return '<svg viewBox="0 0 100 20" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><line x1="0" y1="10" x2="100" y2="10" stroke="var(--sf, #4f8df7)" stroke-width="var(--sl, 4px)" stroke-linecap="round" /></svg>';
        case 'arrowLineRight':
          return '<svg viewBox="0 0 100 20" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><line x1="0" y1="10" x2="86" y2="10" stroke="var(--sf, #4f8df7)" stroke-width="var(--sl, 4px)" stroke-linecap="round" /><polygon points="84,2 100,10 84,18" fill="var(--sf, #4f8df7)" /></svg>';
        case 'arrowLineLeft':
          return '<svg viewBox="0 0 100 20" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><line x1="14" y1="10" x2="100" y2="10" stroke="var(--sf, #4f8df7)" stroke-width="var(--sl, 4px)" stroke-linecap="round" /><polygon points="16,2 0,10 16,18" fill="var(--sf, #4f8df7)" /></svg>';
        case 'doubleArrowLine':
          return '<svg viewBox="0 0 100 20" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><line x1="14" y1="10" x2="86" y2="10" stroke="var(--sf, #4f8df7)" stroke-width="var(--sl, 4px)" /><polygon points="16,2 0,10 16,18" fill="var(--sf, #4f8df7)" /><polygon points="84,2 100,10 84,18" fill="var(--sf, #4f8df7)" /></svg>';
        case 'arrowRight':
          return '<svg viewBox="0 0 100 50" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="0,15 62,15 62,0 100,25 62,50 62,35 0,35" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'arrowLeft':
          return '<svg viewBox="0 0 100 50" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="38,0 38,15 100,15 100,35 38,35 38,50 0,25" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'arrowUp':
          return '<svg viewBox="0 0 50 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="25,0 50,38 35,38 35,100 15,100 15,38 0,38" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'arrowDown':
          return '<svg viewBox="0 0 50 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="15,0 35,0 35,62 50,62 25,100 0,62 15,62" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'chevron':
          return '<svg viewBox="0 0 100 50" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="0,0 70,0 100,25 70,50 0,50 30,25" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'round':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><rect x="2" y="2" width="96" height="56" rx="14" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" /></svg>';
        case 'oval':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><ellipse cx="50" cy="30" rx="48" ry="28" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" /></svg>';
        case 'diamond':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="50,2 98,30 50,58 2,30" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'triangle':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="50,2 98,58 2,58" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'rightTriangle':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="2,2 98,58 2,58" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'parallelogram':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="20,2 98,2 80,58 2,58" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'trapezoid':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="20,2 80,2 98,58 2,58" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'pentagon':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="50,2 98,22 80,58 20,58 2,22" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'hexagon':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="25,2 75,2 98,30 75,58 25,58 2,30" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'star5':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="50,2 61,22 84,22 65,36 72,58 50,44 28,58 35,36 16,22 39,22" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'star4':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="50,2 62,22 98,30 62,38 50,58 38,38 2,30 38,22" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'heart':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><path d="M50 55 C20 40, 2 25, 2 14 C2 5, 14 2, 24 2 C35 2, 45 10, 50 16 C55 10, 65 2, 76 2 C86 2, 98 5, 98 14 C98 25, 80 40, 50 55 Z" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'cloud':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><path d="M20 48 A14 14 0 0 1 12 28 A16 16 0 0 1 35 14 A22 22 0 0 1 70 12 A18 18 0 0 1 88 28 A14 14 0 0 1 80 48 Z" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'callout':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="2,2 98,2 98,42 45,42 30,58 35,42 2,42" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" stroke-linejoin="round" /></svg>';
        case 'thought':
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><ellipse cx="50" cy="26" rx="46" ry="22" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" /><circle cx="22" cy="52" r="4" fill="var(--sf, #4f8df7)" /><circle cx="14" cy="58" r="2.5" fill="var(--sf, #4f8df7)" /></svg>';
        case 'cube3d':
          return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><polygon points="50,15 85,32 50,50 15,32" fill="var(--sf, #4f8df7)" opacity="0.9"/><polygon points="15,32 50,50 50,85 15,68" fill="var(--sf, #4f8df7)" opacity="0.75"/><polygon points="50,50 85,32 85,68 50,85" fill="var(--sf, #4f8df7)" opacity="0.6"/></svg>';
        case 'sphere3d':
          return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><defs><radialGradient id="presSphere" cx="35%" cy="30%"><stop offset="0%" stop-color="#fff" stop-opacity="0.9"/><stop offset="40%" stop-color="var(--sf, #4f8df7)"/><stop offset="100%" stop-color="#000" stop-opacity="0.7"/></radialGradient></defs><circle cx="50" cy="50" r="44" fill="url(#presSphere)"/></svg>';
        default:
          return '<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><rect x="2" y="2" width="96" height="56" fill="var(--sf, #4f8df7)" stroke="var(--ss, #fff)" stroke-width="var(--sl, 2px)" /></svg>';
      }
    }

    function getAnimFrames(name, rot = 0) {
      const r = Number(rot) || 0;
      const rotStr = r ? (' rotate(' + r + 'deg)') : '';
      const baseMap = {
        // ── Entrance Animations ──────────────────────────
        fade: [
          { opacity: 0, transform: 'rotate(' + r + 'deg)' },
          { opacity: 1, transform: 'rotate(' + r + 'deg)' }
        ],
        appear: [
          { opacity: 0, transform: 'rotate(' + r + 'deg)' },
          { opacity: 1, transform: 'rotate(' + r + 'deg)' }
        ],
        slideLeft: [
          { opacity: 0, transform: 'translateX(-90px)' + rotStr },
          { opacity: 1, transform: 'translateX(0)' + rotStr }
        ],
        slideRight: [
          { opacity: 0, transform: 'translateX(90px)' + rotStr },
          { opacity: 1, transform: 'translateX(0)' + rotStr }
        ],
        slideUp: [
          { opacity: 0, transform: 'translateY(70px)' + rotStr },
          { opacity: 1, transform: 'translateY(0)' + rotStr }
        ],
        slideDown: [
          { opacity: 0, transform: 'translateY(-70px)' + rotStr },
          { opacity: 1, transform: 'translateY(0)' + rotStr }
        ],
        zoom: [
          { opacity: 0, transform: 'scale(.2)' + rotStr },
          { opacity: 1, transform: 'scale(1)' + rotStr }
        ],
        pop: [
          { opacity: 0, transform: 'scale(.2)' + rotStr },
          { opacity: 1, transform: 'scale(1.15)' + rotStr, offset: 0.7 },
          { opacity: 1, transform: 'scale(1)' + rotStr }
        ],
        flipX: [
          { opacity: 0, transform: 'perspective(500px) rotateX(90deg)' + rotStr },
          { opacity: 1, transform: 'perspective(500px) rotateX(0deg)' + rotStr }
        ],
        flipY: [
          { opacity: 0, transform: 'perspective(500px) rotateY(90deg)' + rotStr },
          { opacity: 1, transform: 'perspective(500px) rotateY(0deg)' + rotStr }
        ],
        wipeLeft: [
          { opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'rotate(' + r + 'deg)' },
          { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'rotate(' + r + 'deg)' }
        ],
        wipeRight: [
          { opacity: 0, clipPath: 'inset(0 0 0 100%)', transform: 'rotate(' + r + 'deg)' },
          { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'rotate(' + r + 'deg)' }
        ],
        wipeDown: [
          { opacity: 0, clipPath: 'inset(0 0 100% 0)', transform: 'rotate(' + r + 'deg)' },
          { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'rotate(' + r + 'deg)' }
        ],
        wipeUp: [
          { opacity: 0, clipPath: 'inset(100% 0 0 0)', transform: 'rotate(' + r + 'deg)' },
          { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'rotate(' + r + 'deg)' }
        ],
        curtainWipe: [
          { opacity: 0, clipPath: 'circle(0% at 50% 50%)', transform: 'rotate(' + r + 'deg)' },
          { opacity: 1, clipPath: 'circle(100% at 50% 50%)', transform: 'rotate(' + r + 'deg)' }
        ],
        zoomRotate: [
          { opacity: 0, transform: 'scale(0.1) rotate(' + (r - 180) + 'deg)' },
          { opacity: 1, transform: 'scale(1) rotate(' + r + 'deg)' }
        ],
        elasticDrop: [
          { opacity: 0, transform: 'translateY(-140px) scale(0.7, 1.3)' + rotStr },
          { opacity: 1, transform: 'translateY(18px) scale(1.12, 0.88)' + rotStr, offset: 0.65 },
          { opacity: 1, transform: 'translateY(-6px) scale(0.96, 1.04)' + rotStr, offset: 0.85 },
          { opacity: 1, transform: 'translateY(0) scale(1, 1)' + rotStr }
        ],
        swingDown: [
          { opacity: 0, transform: 'perspective(600px) rotateX(-90deg)' + rotStr, transformOrigin: 'top center' },
          { opacity: 1, transform: 'perspective(600px) rotateX(25deg)' + rotStr, transformOrigin: 'top center', offset: 0.6 },
          { opacity: 1, transform: 'perspective(600px) rotateX(-10deg)' + rotStr, transformOrigin: 'top center', offset: 0.8 },
          { opacity: 1, transform: 'perspective(600px) rotateX(0deg)' + rotStr, transformOrigin: 'top center' }
        ],
        blurFadeIn: [
          { opacity: 0, filter: 'blur(20px)', transform: 'scale(1.15)' + rotStr },
          { opacity: 1, filter: 'blur(0px)', transform: 'scale(1)' + rotStr }
        ],
        stamp: [
          { opacity: 0, transform: 'scale(3)' + rotStr },
          { opacity: 1, transform: 'scale(1)' + rotStr, offset: 0.6 },
          { opacity: 1, transform: 'scale(1.08)' + rotStr, offset: 0.8 },
          { opacity: 1, transform: 'scale(1)' + rotStr }
        ],
        rollIn: [
          { opacity: 0, transform: 'translateX(-120px) rotate(' + (r - 120) + 'deg)' },
          { opacity: 1, transform: 'translateX(0) rotate(' + r + 'deg)' }
        ],
        lightSpeed: [
          { opacity: 0, transform: 'translateX(120px) skewX(-25deg)' + rotStr },
          { opacity: 1, transform: 'translateX(-15px) skewX(10deg)' + rotStr, offset: 0.7 },
          { opacity: 1, transform: 'translateX(0) skewX(0deg)' + rotStr }
        ],
        rubberBandIn: [
          { opacity: 0, transform: 'scale(0.3)' + rotStr },
          { opacity: 1, transform: 'scale(1.25, 0.75)' + rotStr, offset: 0.5 },
          { opacity: 1, transform: 'scale(0.75, 1.25)' + rotStr, offset: 0.7 },
          { opacity: 1, transform: 'scale(1.1, 0.9)' + rotStr, offset: 0.85 },
          { opacity: 1, transform: 'scale(1, 1)' + rotStr }
        ],
        spiralIn: [
          { opacity: 0, filter: 'blur(8px)', transform: 'scale(0.1) rotate(' + (r + 360) + 'deg)' },
          { opacity: 1, filter: 'blur(0px)', transform: 'scale(1) rotate(' + r + 'deg)' }
        ],
        backInDown: [
          { opacity: 0.2, transform: 'translateY(-180px) scale(0.6)' + rotStr },
          { opacity: 1, transform: 'translateY(12px) scale(1.05)' + rotStr, offset: 0.7 },
          { opacity: 1, transform: 'translateY(0) scale(1)' + rotStr }
        ],
        backInUp: [
          { opacity: 0.2, transform: 'translateY(180px) scale(0.6)' + rotStr },
          { opacity: 1, transform: 'translateY(-12px) scale(1.05)' + rotStr, offset: 0.7 },
          { opacity: 1, transform: 'translateY(0) scale(1)' + rotStr }
        ],

        // ── Emphasis / Continuous / Attention Animations ──
        pulse: [
          { transform: 'scale(1)' + rotStr },
          { transform: 'scale(1.12)' + rotStr, offset: 0.5 },
          { transform: 'scale(1)' + rotStr }
        ],
        bounce: [
          { transform: 'translateY(0)' + rotStr },
          { transform: 'translateY(-28px)' + rotStr, offset: 0.4 },
          { transform: 'translateY(0)' + rotStr, offset: 0.7 },
          { transform: 'translateY(-12px)' + rotStr, offset: 0.85 },
          { transform: 'translateY(0)' + rotStr }
        ],
        spin: [
          { transform: 'rotate(' + r + 'deg)' },
          { transform: 'rotate(' + (r + 360) + 'deg)' }
        ],
        spin3d: [
          { transform: 'perspective(700px) rotateY(0deg)' + rotStr },
          { transform: 'perspective(700px) rotateY(360deg)' + rotStr }
        ],
        flip3dX: [
          { transform: 'perspective(700px) rotateX(0deg)' + rotStr },
          { transform: 'perspective(700px) rotateX(360deg)' + rotStr }
        ],
        swing: [
          { transform: 'rotate(' + r + 'deg)' },
          { transform: 'rotate(' + (r + 15) + 'deg)', offset: 0.25 },
          { transform: 'rotate(' + (r - 10) + 'deg)', offset: 0.5 },
          { transform: 'rotate(' + (r + 6) + 'deg)', offset: 0.75 },
          { transform: 'rotate(' + r + 'deg)' }
        ],
        float: [
          { transform: 'translateY(0)' + rotStr },
          { transform: 'translateY(-18px)' + rotStr, offset: 0.5 },
          { transform: 'translateY(0)' + rotStr }
        ],
        jello: [
          { transform: 'skew(0)' + rotStr },
          { transform: 'skew(-12deg,-12deg)' + rotStr, offset: 0.3 },
          { transform: 'skew(7deg,7deg)' + rotStr, offset: 0.6 },
          { transform: 'skew(-3deg,-3deg)' + rotStr, offset: 0.8 },
          { transform: 'skew(0)' + rotStr }
        ],
        shake: [
          { transform: 'translateX(0)' + rotStr },
          { transform: 'translateX(-18px)' + rotStr, offset: 0.2 },
          { transform: 'translateX(18px)' + rotStr, offset: 0.4 },
          { transform: 'translateX(-12px)' + rotStr, offset: 0.6 },
          { transform: 'translateX(12px)' + rotStr, offset: 0.8 },
          { transform: 'translateX(0)' + rotStr }
        ],
        heartbeat: [
          { transform: 'scale(1)' + rotStr },
          { transform: 'scale(1.18)' + rotStr, offset: 0.14 },
          { transform: 'scale(1)' + rotStr, offset: 0.28 },
          { transform: 'scale(1.24)' + rotStr, offset: 0.42 },
          { transform: 'scale(1)' + rotStr, offset: 0.7 },
          { transform: 'scale(1)' + rotStr }
        ],
        glowPulse: [
          { filter: 'drop-shadow(0 0 0 rgba(79,141,247,0)) brightness(1)' },
          { filter: 'drop-shadow(0 0 20px rgba(79,141,247,0.95)) brightness(1.3)', offset: 0.5 },
          { filter: 'drop-shadow(0 0 0 rgba(79,141,247,0)) brightness(1)' }
        ],
        tilt3d: [
          { transform: 'perspective(600px) rotateX(0deg) rotateY(0deg)' + rotStr },
          { transform: 'perspective(600px) rotateX(15deg) rotateY(-18deg)' + rotStr, offset: 0.33 },
          { transform: 'perspective(600px) rotateX(-12deg) rotateY(15deg)' + rotStr, offset: 0.66 },
          { transform: 'perspective(600px) rotateX(0deg) rotateY(0deg)' + rotStr }
        ],
        tada: [
          { transform: 'scale(1)' + rotStr },
          { transform: 'scale(0.9) rotate(' + (r - 4) + 'deg)', offset: 0.15 },
          { transform: 'scale(1.15) rotate(' + (r + 4) + 'deg)', offset: 0.35 },
          { transform: 'scale(1.15) rotate(' + (r - 4) + 'deg)', offset: 0.55 },
          { transform: 'scale(1.15) rotate(' + (r + 3) + 'deg)', offset: 0.75 },
          { transform: 'scale(1) rotate(' + r + 'deg)' }
        ],
        wobble: [
          { transform: 'translateX(0) rotate(' + r + 'deg)' },
          { transform: 'translateX(-15px) rotate(' + (r - 5) + 'deg)', offset: 0.2 },
          { transform: 'translateX(15px) rotate(' + (r + 4) + 'deg)', offset: 0.4 },
          { transform: 'translateX(-10px) rotate(' + (r - 3) + 'deg)', offset: 0.6 },
          { transform: 'translateX(8px) rotate(' + (r + 2) + 'deg)', offset: 0.8 },
          { transform: 'translateX(0) rotate(' + r + 'deg)' }
        ],
        rubberBand: [
          { transform: 'scale3d(1, 1, 1)' + rotStr },
          { transform: 'scale3d(1.25, 0.75, 1)' + rotStr, offset: 0.3 },
          { transform: 'scale3d(0.75, 1.25, 1)' + rotStr, offset: 0.4 },
          { transform: 'scale3d(1.15, 0.85, 1)' + rotStr, offset: 0.6 },
          { transform: 'scale3d(0.95, 1.05, 1)' + rotStr, offset: 0.8 },
          { transform: 'scale3d(1, 1, 1)' + rotStr }
        ],
        flash: [
          { opacity: 1 },
          { opacity: 0.15, offset: 0.25 },
          { opacity: 1, offset: 0.5 },
          { opacity: 0.15, offset: 0.75 },
          { opacity: 1 }
        ],
        glitch: [
          { transform: 'translate(0, 0)' + rotStr },
          { transform: 'translate(-6px, 3px) skewX(4deg)' + rotStr, offset: 0.2 },
          { transform: 'translate(6px, -3px) skewX(-4deg)' + rotStr, offset: 0.4 },
          { transform: 'translate(-4px, -2px) skewX(3deg)' + rotStr, offset: 0.6 },
          { transform: 'translate(4px, 2px) skewX(-2deg)' + rotStr, offset: 0.8 },
          { transform: 'translate(0, 0)' + rotStr }
        ],
        breath: [
          { transform: 'scale(1)' + rotStr, filter: 'brightness(1)' },
          { transform: 'scale(1.06)' + rotStr, filter: 'brightness(1.15)', offset: 0.5 },
          { transform: 'scale(1)' + rotStr, filter: 'brightness(1)' }
        ],
        vibrate: [
          { transform: 'translate(0, 0)' + rotStr },
          { transform: 'translate(-3px, 2px)' + rotStr, offset: 0.15 },
          { transform: 'translate(3px, -2px)' + rotStr, offset: 0.35 },
          { transform: 'translate(-3px, -2px)' + rotStr, offset: 0.55 },
          { transform: 'translate(3px, 2px)' + rotStr, offset: 0.75 },
          { transform: 'translate(0, 0)' + rotStr }
        ],
        shimmer: [
          { filter: 'brightness(1) contrast(1)' },
          { filter: 'brightness(1.7) contrast(1.25)', offset: 0.5 },
          { filter: 'brightness(1) contrast(1)' }
        ],

        // ── Exit Animations ──────────────────────────────
        fadeOut: [
          { opacity: 1, transform: 'rotate(' + r + 'deg)' },
          { opacity: 0, transform: 'rotate(' + r + 'deg)' }
        ],
        zoomOut: [
          { opacity: 1, transform: 'scale(1)' + rotStr },
          { opacity: 0, transform: 'scale(.2)' + rotStr }
        ],
        slideOutRight: [
          { opacity: 1, transform: 'translateX(0)' + rotStr },
          { opacity: 0, transform: 'translateX(120px)' + rotStr }
        ],
        slideOutLeft: [
          { opacity: 1, transform: 'translateX(0)' + rotStr },
          { opacity: 0, transform: 'translateX(-120px)' + rotStr }
        ],
        slideOutUp: [
          { opacity: 1, transform: 'translateY(0)' + rotStr },
          { opacity: 0, transform: 'translateY(-100px)' + rotStr }
        ],
        slideOutDown: [
          { opacity: 1, transform: 'translateY(0)' + rotStr },
          { opacity: 0, transform: 'translateY(100px)' + rotStr }
        ],
        spinOut: [
          { opacity: 1, transform: 'scale(1) rotate(' + r + 'deg)' },
          { opacity: 0, transform: 'scale(0.1) rotate(' + (r + 360) + 'deg)' }
        ],
        flipOutX: [
          { opacity: 1, transform: 'perspective(500px) rotateX(0deg)' + rotStr },
          { opacity: 0, transform: 'perspective(500px) rotateX(90deg)' + rotStr }
        ],
        flipOutY: [
          { opacity: 1, transform: 'perspective(500px) rotateY(0deg)' + rotStr },
          { opacity: 0, transform: 'perspective(500px) rotateY(90deg)' + rotStr }
        ],
        blurFadeOut: [
          { opacity: 1, filter: 'blur(0px)', transform: 'scale(1)' + rotStr },
          { opacity: 0, filter: 'blur(20px)', transform: 'scale(0.85)' + rotStr }
        ],
        shrinkPop: [
          { opacity: 1, transform: 'scale(1)' + rotStr },
          { opacity: 1, transform: 'scale(1.2)' + rotStr, offset: 0.3 },
          { opacity: 0, transform: 'scale(0.1)' + rotStr }
        ],
        wipeOutLeft: [
          { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'rotate(' + r + 'deg)' },
          { opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'rotate(' + r + 'deg)' }
        ],
        wipeOutRight: [
          { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'rotate(' + r + 'deg)' },
          { opacity: 0, clipPath: 'inset(0 0 0 100%)', transform: 'rotate(' + r + 'deg)' }
        ]
      };
      return baseMap[name] || baseMap.fade;
    }

    const themes = {
      fashion: 'linear-gradient(135deg, #170b32, #192d58)',
      luxury: 'linear-gradient(135deg, #1d1307, #76500a)',
      ocean: 'linear-gradient(135deg, #06203d, #0c5d86)',
      royal: 'linear-gradient(135deg, #2b1055, #7597de)',
      blush: 'linear-gradient(135deg, #5e1938, #f06292)',
      emerald: 'linear-gradient(135deg, #063b36, #16a085)',
      sunset: 'linear-gradient(135deg, #5b1a13, #f59e0b)',
      clean: '#f8fafc'
    };

    let slides = [];
    let currentIndex = 0;
    let autoTimer = null;
    let recognition = null;

    function buildElement(el) {
      const node = document.createElement('div');
      const rot = Number(el.rotation) || 0;

      if (el.type === 'shape') {
        node.className = 'element shape-el' + (el.shape ? ' shape-' + el.shape : '');
        const fillVal = el.fill || el.fillColor || el.bgColor || el.color || '#4f8df7';
        const strokeVal = el.stroke || el.borderColor || el.lineColor || '#ffffff';
        const lineVal = el.line !== undefined ? Number(el.line) : (el.borderWidth !== undefined ? Number(el.borderWidth) : 2);
        let opVal = 1;
        if (el.opacity !== undefined) {
          const num = Number(el.opacity);
          opVal = num <= 1 ? num : num / 100;
        }
        node.style.cssText = 'left:' + el.x + '%;top:' + el.y + '%;width:' + el.w + '%;height:' + el.h + '%;transform:rotate(' + rot + 'deg);transform-origin:center center;';

        const body = document.createElement('div');
        body.className = 'shape-body';
        body.style.opacity = opVal;

        let svg = getShapeSvg(el.shape);
        svg = svg.replace(/var\(--sf[^)]*\)/g, fillVal)
                 .replace(/var\(--ss[^)]*\)/g, strokeVal)
        if (el.shapeImage) {
          body.innerHTML = '';
          const sImg = document.createElement('img');
          sImg.src = el.shapeImage;
          sImg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit;z-index:2;';
          node.appendChild(sImg);
        } else {
          body.innerHTML = svg;
          node.appendChild(body);
        }

        if (el.text && !el.shapeImage) {
          const label = document.createElement('div');
          label.className = 'shape-label';
          const txtColor = el.textColor || el.color || '#ffffff';
          const txtSize = Number(el.textSize || el.size || 18);
          const txtWeight = el.textWeight || el.weight || '700';
          label.style.color = txtColor;
          label.style.fontSize = txtSize + 'px';
          label.style.fontWeight = (txtWeight === '900' || txtWeight === 'bold') ? '900' : '700';
          label.style.fontFamily = el.fontFamily || 'Inter, Arial, "Noto Sans Bengali", sans-serif';
          label.style.textAlign = el.textAlign || 'center';
          label.style.lineHeight = el.lineSpacing || el.lineHeight || '1.25';
          label.style.justifyContent = el.textAlign === 'left' ? 'flex-start' : el.textAlign === 'right' ? 'flex-end' : 'center';
          label.style.wordBreak = 'break-word';
          label.style.overflowWrap = 'break-word';
          label.style.whiteSpace = 'pre-wrap';
          label.style.padding = '8px 12px';
          label.style.boxSizing = 'border-box';
          label.textContent = el.text;
          node.appendChild(label);
        }
      } else if (el.type === 'image') {
        node.className = 'element image-el' + ((el.fit || 'contain') === 'cover' ? ' fit-cover' : '');
        let imgCss = 'left:' + el.x + '%;top:' + el.y + '%;width:' + el.w + '%;height:' + el.h + '%;transform:rotate(' + rot + 'deg);transform-origin:center center;';
        if (el.borderRadius) imgCss += 'border-radius:' + el.borderRadius + 'px;';
        if (el.opacity !== undefined) imgCss += 'opacity:' + (Number(el.opacity) / 100) + ';';
        if (el.borderWidth) imgCss += 'border:' + el.borderWidth + 'px solid ' + (el.borderColor || '#ffffff') + ';';
        node.style.cssText = imgCss;
        const img = new Image();
        img.src = el.src;
        img.style.objectFit = el.fit || 'contain';
        img.draggable = false;
        node.appendChild(img);

      } else if (el.type === 'video') {
        node.className = 'element video-el key-' + (el.transparency || 'none');
        node.style.cssText = 'left:' + el.x + '%;top:' + el.y + '%;width:' + el.w + '%;height:' + el.h + '%;transform:rotate(' + rot + 'deg);transform-origin:center center;';
        const vid = document.createElement('video');
        vid.src = el.src; vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
        vid.play().catch(() => {});
        node.appendChild(vid);

      } else if (el.type === 'table') {
        node.className = 'element table-el';
        node.style.cssText = 'left:' + el.x + '%;top:' + el.y + '%;width:' + el.w + '%;height:' + el.h + '%;transform:rotate(' + rot + 'deg);transform-origin:center center;font-size:' + (el.textSize || 14) + 'px;';
        const table = document.createElement('table');
        (el.data || []).forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement('td');
            td.textContent = cell;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        node.appendChild(table);

      } else {
        node.className = 'element text-el';
        const textAlign = el.textAlign || 'center';
        const lineH = el.lineSpacing || el.lineHeight || '1.2';
        const fontW = el.weight || el.textWeight || '700';
        const fontFam = el.fontFamily || 'Inter, Arial, "Noto Sans Bengali", sans-serif';
        const fontSty = el.fontStyle || 'normal';
        const textDec = el.textDecoration || 'none';
        const pad = (el.padding !== undefined ? el.padding : 6) + 'px';
        const txtColor = el.color || el.textColor || '#ffffff';
        const txtSize = Number(el.size || el.textSize || 38);

        let css = 'left:' + el.x + '%;top:' + el.y + '%;width:' + el.w + '%;height:' + el.h + '%;'
          + 'font-size:' + txtSize + 'px;'
          + 'font-weight:' + fontW + ';'
          + 'font-style:' + fontSty + ';'
          + 'text-decoration:' + textDec + ';'
          + 'font-family:' + fontFam + ';'
          + 'text-align:' + textAlign + ';'
          + 'line-height:' + lineH + ';'
          + 'padding:' + pad + ';'
          + 'transform:rotate(' + rot + 'deg);transform-origin:center center;'
          + 'white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;box-sizing:border-box;';

        if (el.textGradient) {
          css += 'background:linear-gradient(' + (el.textGradientAngle ?? 90) + 'deg, ' + txtColor + ', ' + (el.textGradientTo || '#4f8df7') + ');'
               + '-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;';
        } else {
          css += 'color:' + txtColor + ';';
        }

        const boxBgColor = el.boxBg || el.backgroundColor || el.bgColor || (el.background && el.background.startsWith('#') ? el.background : null);
        let boxOp = 1;
        if (el.boxOpacity !== undefined) {
          const num = Number(el.boxOpacity);
          boxOp = num <= 1 ? num : num / 100;
        }
        if (boxBgColor && boxBgColor !== 'transparent' && boxOp > 0) {
          if (boxBgColor.startsWith('#') && boxOp < 1) {
            const hex = boxBgColor.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) || 0,
                  g = parseInt(hex.substring(2, 4), 16) || 0,
                  b = parseInt(hex.substring(4, 6), 16) || 0;
            css += 'background-color:rgba(' + r + ',' + g + ',' + b + ',' + boxOp + ');border-radius:6px;';
          } else {
            css += 'background-color:' + boxBgColor + ';border-radius:6px;';
          }
          css += 'display:flex;align-items:center;justify-content:' + (textAlign === 'left' ? 'flex-start' : textAlign === 'right' ? 'flex-end' : 'center') + ';';
        }

        node.style.cssText = css;
        node.textContent = el.text || '';
      }

      return node;
    }

    function drawSlide(targetStep) {
      const stage = document.getElementById('stage');
      if (!slides.length || !stage) return;
      const slide = slides[currentIndex];
      stage.replaceChildren();

      // ── Robust Background Handling (Colors, Themes, Gradients, Images, Videos) ──
      if (slide.background === 'custom') {
        stage.style.background = slide.bgColor || '#17233c';
        stage.style.backgroundImage = '';
      } else if (slide.background === 'image' && slide.bgImage) {
        stage.style.backgroundImage = 'linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url("' + slide.bgImage + '")';
        stage.style.backgroundSize = 'cover';
        stage.style.backgroundPosition = 'center';
      } else if (slide.background && (slide.background.startsWith('linear-gradient') || slide.background.startsWith('radial-gradient') || slide.background.startsWith('#') || slide.background.startsWith('rgb'))) {
        stage.style.background = slide.background;
        stage.style.backgroundImage = '';
      } else if (themes[slide.background]) {
        stage.style.background = themes[slide.background];
        stage.style.backgroundImage = '';
      } else if (slide.bgColor && slide.bgColor !== 'transparent') {
        stage.style.background = slide.bgColor;
        stage.style.backgroundImage = '';
      } else {
        // Default theme fallback
        stage.style.background = (themes.fashion || '#17233c');
        stage.style.backgroundImage = '';
      }

      // ── B-Roll Animated Layer ──
      if (slide.brollPreset && slide.brollPreset !== 'none') {
        const broll = document.createElement('div');
        broll.id = 'brollLayer';
        let pClass = slide.brollPreset;
        if (pClass === 'cloudSunset') pClass = 'sunset cloudSunset';
        broll.className = pClass + ' ' + slide.brollPreset + ' speed-' + (slide.brollSpeed || 'normal');
        stage.appendChild(broll);
      }

      // ── Background Video / GIF Media Layer ──
      if (slide.bgMedia) {
        const mediaEl = document.createElement(slide.bgMediaType === 'video' ? 'video' : 'img');
        mediaEl.className = 'bg-media';
        mediaEl.src = slide.bgMedia;
        if (mediaEl.tagName === 'VIDEO') {
          mediaEl.autoplay = true; mediaEl.loop = true; mediaEl.muted = true; mediaEl.playsInline = true;
          mediaEl.playbackRate = Number(slide.bgPlaybackRate || 1);
          mediaEl.addEventListener('canplay', () => mediaEl.play().catch(() => {}), { once: true });
          mediaEl.play().catch(() => {});
        }
        mediaEl.style.opacity = (slide.bgMediaOpacity !== undefined ? slide.bgMediaOpacity : 100) / 100;
        if (slide.bgMediaBlur) mediaEl.style.filter = 'blur(' + slide.bgMediaBlur + 'px)';
        stage.appendChild(mediaEl);

        if (slide.bgOverlayOpacity) {
          const ov = document.createElement('div');
          const hex = Math.round((slide.bgOverlayOpacity / 100) * 255).toString(16).padStart(2, '0');
          ov.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:1;background:' + (slide.bgOverlayColor || '#000000') + hex + ';';
          stage.appendChild(ov);
        }
      }

      const contentLayer = document.createElement('div');
      contentLayer.className = 'content-layer';
      stage.appendChild(contentLayer);

      const animList = [];

      (slide.elements || []).forEach((el, elemIdx) => {
        const node = buildElement(el);
        contentLayer.appendChild(node);

        const hasAnimation = el.animation && el.animation !== 'none';
        if (hasAnimation) {
          node.style.visibility = 'hidden';
          animList.push({
            node,
            el,
            order: Number(el.animationOrder) || 0,
            start: el.animationStart || 'click',
            duration: Math.max(0.1, Number(el.animationDuration) || 0.6) * 1000,
            delay: Math.max(0, Number(el.animationDelay) || 0) * 1000,
            loop: !!el.animationLoop,
            index: elemIdx
          });
        } else {
          node.style.visibility = 'visible';
        }
      });

      // Group into sequential steps
      slideSteps = [];

      if (animList.length > 0) {
        animList.sort((a, b) => (a.order - b.order) || (a.index - b.index));

        let currentGroup = [];
        animList.forEach((item) => {
          if (item.start === 'after') {
            item.isAfter = true;
            if (currentGroup.length > 0) {
              currentGroup.push(item);
            } else if (slideSteps.length > 0) {
              slideSteps[slideSteps.length - 1].push(item);
            } else {
              currentGroup.push(item);
            }
          } else if (item.start === 'with') {
            if (currentGroup.length > 0) {
              currentGroup.push(item);
            } else if (slideSteps.length > 0) {
              slideSteps[slideSteps.length - 1].push(item);
            } else {
              currentGroup.push(item);
            }
          } else {
            // 'click' or default step
            if (currentGroup.length > 0) {
              slideSteps.push(currentGroup);
              currentGroup = [];
            }
            currentGroup.push(item);
          }
        });
        if (currentGroup.length > 0) {
          slideSteps.push(currentGroup);
        }

        // Apply target step state
        if (targetStep === 'all') {
          // Reveal all steps fully
          slideSteps.forEach(group => {
            group.forEach(item => {
              item.node.style.visibility = 'visible';
            });
          });
          currentStepIdx = slideSteps.length;
        } else if (typeof targetStep === 'number') {
          currentStepIdx = Math.max(0, Math.min(targetStep, slideSteps.length));
          slideSteps.forEach((group, gIdx) => {
            const isVisible = gIdx < currentStepIdx;
            group.forEach(item => {
              item.node.style.visibility = isVisible ? 'visible' : 'hidden';
            });
          });
        } else {
          // Default start of slide
          currentStepIdx = 0;
          slideSteps.forEach(group => {
            group.forEach(item => {
              item.node.style.visibility = 'hidden';
            });
          });
          // Auto trigger first group if 'with'
          if (slideSteps.length > 0 && slideSteps[0].length > 0 && slideSteps[0][0].start === 'with') {
            executeStepGroup(slideSteps[0]);
            currentStepIdx = 1;
          }
        }
      } else {
        currentStepIdx = 0;
      }

      updateInfoDisplay();
      updateDrawerActive();

      clearTimeout(autoTimer);
      if (Number(slide.autoDuration) > 0) {
        autoTimer = setTimeout(() => advanceNext(), Number(slide.autoDuration) * 1000);
      }
    }

    let slideSteps = [];
    let currentStepIdx = 0;
    let chainedTimers = [];

    function clearChainedTimers() {
      chainedTimers.forEach(t => clearTimeout(t));
      chainedTimers = [];
    }

    function playItem(item) {
      item.node.style.visibility = 'visible';
      const keyframes = getAnimFrames(item.el.animation, item.el.rotation);
      item.node.animate(keyframes, {
        duration: item.duration,
        delay: item.delay,
        iterations: item.loop ? Infinity : 1,
        easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
        fill: 'both'
      });
    }

    function executeStepGroup(stepGroup) {
      clearChainedTimers();
      let baseMax = 0;
      stepGroup.forEach(item => {
        if (!item.isAfter) {
          playItem(item);
          baseMax = Math.max(baseMax, item.duration + item.delay);
        }
      });

      let cumulative = baseMax;
      stepGroup.filter(item => item.isAfter).forEach(item => {
        const tm = setTimeout(() => {
          playItem(item);
        }, cumulative + item.delay);
        chainedTimers.push(tm);
        cumulative += item.delay + item.duration;
      });
    }

    function updateInfoDisplay() {
      const info = document.getElementById('slideInfo');
      if (!info) return;
      if (slideSteps.length > 0 && currentStepIdx < slideSteps.length) {
        info.textContent = (currentIndex + 1) + ' / ' + slides.length + ' (Step ' + (currentStepIdx + 1) + '/' + slideSteps.length + ')';
      } else {
        info.textContent = (currentIndex + 1) + ' / ' + slides.length;
      }
    }

    function advanceNext() {
      clearTimeout(autoTimer);
      if (currentStepIdx < slideSteps.length) {
        const stepItems = slideSteps[currentStepIdx];
        executeStepGroup(stepItems);
        currentStepIdx++;
        updateInfoDisplay();
        return;
      }
      if (!slides.length) return;
      currentIndex = (currentIndex + 1) % slides.length;
      drawSlide();
    }

    function advancePrev() {
      clearTimeout(autoTimer);
      clearChainedTimers();
      if (!slides.length) return;

      // 1. If currently inside animation steps on this slide, step back!
      if (slideSteps.length > 0 && currentStepIdx > 0) {
        const hasAutoWith = slideSteps[0] && slideSteps[0][0] && slideSteps[0][0].start === 'with';
        const minStep = hasAutoWith ? 1 : 0;
        if (currentStepIdx > minStep) {
          drawSlide(currentStepIdx - 1);
          return;
        }
      }

      // 2. Otherwise, jump to previous slide with all steps revealed!
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      drawSlide('all');
    }

    function advanceSlide(delta) {
      clearTimeout(autoTimer);
      clearChainedTimers();
      if (!slides.length) return;
      currentIndex = (currentIndex + delta + slides.length) % slides.length;
      drawSlide();
    }

    function advance(step) {
      if (step > 0) advanceNext();
      else advancePrev();
    }

    window.advanceNext = advanceNext;
    window.advancePrev = advancePrev;
    window.advanceSlide = advanceSlide;
    window.drawSlide = drawSlide;

    function resizeStage() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const scale = Math.min(vw / 960, vh / 540);
      document.documentElement.style.setProperty('--pres-scale', scale);
    }
    window.addEventListener('resize', resizeStage);
    resizeStage();

    function isSlideObject(obj) {
      if (!obj || typeof obj !== 'object') return false;
      return Array.isArray(obj.elements) || typeof obj.background === 'string' || typeof obj.bgColor === 'string' || typeof obj.brollPreset === 'string';
    }

    function extractSlidesFromData(data) {
      if (!data) return null;

      // 1. Direct array of slides or snapshots
      if (Array.isArray(data)) {
        if (data.length > 0 && isSlideObject(data[0])) {
          return data;
        }
        for (const item of data) {
          const res = extractSlidesFromData(item);
          if (res && res.length) return res;
        }
        if (data.length > 0 && typeof data[0] === 'object') {
          return data;
        }
      }

      // 2. Object with nested slides property or backup wrappers
      if (typeof data === 'object') {
        if (Array.isArray(data.slides) && data.slides.length) return extractSlidesFromData(data.slides);
        if (Array.isArray(data.deck) && data.deck.length) return extractSlidesFromData(data.deck);
        if (Array.isArray(data.presentation) && data.presentation.length) return extractSlidesFromData(data.presentation);

        if (data.data) {
          const res = extractSlidesFromData(data.data);
          if (res && res.length) return res;
        }
        if (data.project) {
          const res = extractSlidesFromData(data.project);
          if (res && res.length) return res;
        }
        if (data.content) {
          const res = extractSlidesFromData(data.content);
          if (res && res.length) return res;
        }
        if (data.backup) {
          const res = extractSlidesFromData(data.backup);
          if (res && res.length) return res;
        }
        if (data.emergency_backup) {
          const res = extractSlidesFromData(data.emergency_backup);
          if (res && res.length) return res;
        }
        if (data.current) {
          const res = extractSlidesFromData(data.current);
          if (res && res.length) return res;
        }

        for (const key of Object.keys(data)) {
          if (typeof data[key] === 'object') {
            const res = extractSlidesFromData(data[key]);
            if (res && res.length && isSlideObject(res[0])) return res;
          }
        }
      }
      return null;
    }

    function loadDeck(jsonText) {
      try {
        if (!jsonText || typeof jsonText !== 'string') {
          throw new Error('ফাইলটি খালি বা পড়া যায়নি।');
        }
        const cleanedText = jsonText.trim().replace(/^\uFEFF/, '');
        const data = JSON.parse(cleanedText);

        let foundSlides = extractSlidesFromData(data);

        if (!foundSlides || !Array.isArray(foundSlides) || !foundSlides.length) {
          throw new Error('এই JSON ফাইলে কোনো স্লাইড ডেটা পাওয়া যায়নি। দয়া করে সঠিক Presentation JSON/Backup ফাইল নির্বাচন করুন।');
        }

        slides = foundSlides.map(sl => {
          if (!sl || typeof sl !== 'object') return { background: 'fashion', elements: [] };
          return {
            ...sl,
            elements: Array.isArray(sl.elements) ? sl.elements : []
          };
        });

        currentIndex = 0;
        document.getElementById('dropzone').classList.add('hidden');
        renderDrawer();
        drawSlide();
      } catch(err) {
        alert('❌ ফাইল খুলতে সমস্যা হয়েছে:\n' + err.message);
      }
    }

    const dropzone = document.getElementById('dropzone');
    const dropCard = document.getElementById('dropCard');
    const fileInput = document.getElementById('fileInput');

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        loadDeck(ev.target.result);
        fileInput.value = '';
      };
      reader.readAsText(file);
    });

    ['dragenter', 'dragover'].forEach(name => {
      window.addEventListener(name, e => {
        e.preventDefault();

    function buildSlideThumbnail(sl) {
      const mini = document.createElement('div');
      mini.className = 'thumb-mini-stage';

      // 1. Background
      if (sl.background === 'custom') {
        mini.style.background = sl.bgColor || '#17233c';
      } else if (sl.background === 'image' && sl.bgImage) {
        mini.style.backgroundImage = 'url("' + sl.bgImage + '")';
        mini.style.backgroundSize = 'cover';
        mini.style.backgroundPosition = 'center';
      } else if (sl.background && (sl.background.startsWith('linear-gradient') || sl.background.startsWith('radial-gradient') || sl.background.startsWith('#') || sl.background.startsWith('rgb'))) {
        mini.style.background = sl.background;
      } else if (themes[sl.background]) {
        mini.style.background = themes[sl.background];
      } else if (sl.bgColor && sl.bgColor !== 'transparent') {
        mini.style.background = sl.bgColor;
      } else {
        mini.style.background = '#17233c';
      }

      // 2. B-Roll preset tint
      if (sl.brollPreset === 'space') {
        mini.style.background = 'radial-gradient(circle at 70% 25%, #ffd166 0%, #ff8c00 1.5%, transparent 4%), radial-gradient(circle at 20% 80%, #6366f1 0%, #312e81 8%, transparent 20%), radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%)';
      } else if (sl.brollPreset === 'aurora') {
        mini.style.background = 'radial-gradient(ellipse at 20% 80%, rgba(16, 185, 129, 0.65) 0%, transparent 50%), radial-gradient(ellipse at 70% 30%, rgba(56, 189, 248, 0.7) 0%, transparent 55%), #020617';
      } else if (sl.brollPreset === 'sky') {
        mini.style.background = 'linear-gradient(165deg, #0284c7, #38bdf8 45%, #bae6fd)';
      } else if (sl.brollPreset === 'sunset') {
        mini.style.background = 'linear-gradient(175deg, #4c0519, #be123c 35%, #f97316 65%, #fde047 90%)';
      } else if (sl.brollPreset === 'water') {
        mini.style.background = 'linear-gradient(180deg, #0369a1, #0284c7 45%, #075985)';
      }

      // 3. Render all elements
      if (Array.isArray(sl.elements)) {
        sl.elements.forEach(el => {
          try {
            const node = buildElement(el);
            node.style.animation = 'none';
            node.style.transition = 'none';
            mini.appendChild(node);
          } catch (_) {}
        });
      }

      return mini;
    }

    let isVoiceActive = false;

    function showVoiceToast(msg, type = 'info', duration = 4000) {
      let toast = document.getElementById('voiceToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'voiceToast';
        toast.className = 'voice-toast';
        document.body.appendChild(toast);
      }
      toast.className = 'voice-toast ' + (type !== 'info' ? type : '');
      const icon = type === 'warning' || type === 'error' ? '⚠️' : '🎙️';
      toast.innerHTML = '<span>' + icon + '</span><span>' + msg + '</span>';
      toast.classList.remove('hidden');
      if (duration > 0) {
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.add('hidden'), duration);
      }
    }

    function hideVoiceToast() {
      const toast = document.getElementById('voiceToast');
      if (toast) toast.classList.add('hidden');
    }

    function stopVoice() {
      isVoiceActive = false;
      if (recognition) {
        try { recognition.onend = null; recognition.stop(); } catch(_) {}
        recognition = null;
      }
      const btn = document.getElementById('voiceBtn');
      if (btn) btn.classList.remove('voice-on');
      hideVoiceToast();
    }

    function startVoice() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        showVoiceToast('আপনার ব্রাউজারে Voice Recognition সাপোর্ট নেই। Google Chrome ব্যবহার করুন।', 'error', 6000);
        return;
      }

      // Check file:// protocol restriction in Chrome
      if (window.location.protocol === 'file:') {
        showVoiceToast('⚠️ Chrome ব্রাউজারে file:// প্রটোকলে ভয়েস কমান্ড ব্লকড থাকে! `start.bat` চালিয়ে http://localhost:8000 দিয়ে প্লে করুন।', 'warning', 8000);
      }

      try {
        if (recognition) { stopVoice(); }
        isVoiceActive = true;
        recognition = new Speech();
        recognition.lang = 'bn-BD';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
          const btn = document.getElementById('voiceBtn');
          if (btn) btn.classList.add('voice-on');
          if (window.location.protocol !== 'file:') {
            showVoiceToast('🎙️ ভয়েস কন্ট্রোল চালু হয়েছে! বলুন "Next / নেক্সট" বা "Back / আগেরটা"', 'info', 4000);
          }
        };

        recognition.onresult = e => {
          for (let n = e.resultIndex; n < e.results.length; n++) {
            const transcript = e.results[n][0].transcript.toLowerCase().trim();
            if (e.results[n].isFinal) {
              showVoiceToast('শুনেছি: "' + transcript + '"', 'info', 2000);
              
              if (/next|forward|samne|poroborti|porer|পরবর্তী|পরের|পরেরটা|সামনে|নেক্সট|নেক্সড|আগাও/i.test(transcript)) {
                advance(1);
              }
              // Previous match regex (English & Bangla)
              else if (/back|previous|prev|peshone|ager|আগের|আগেরটা|পেছনে|পিছনে|প্রিভিয়াস|প্রিভিয়াস|পিছাও|আগে/i.test(transcript)) {
                advance(-1);
              }
            }
          }
        };

        recognition.onerror = (e) => {
          console.warn('SpeechRecognition error:', e.error);
          if (e.error === 'no-speech') {
            return; // Non-fatal temporary pause
          }
          if (e.error === 'network' && window.location.protocol === 'file:') {
            showVoiceToast('❌ Chrome-এ file:// প্রটোকলে Speech API চলে না। `start.bat` চালিয়ে http://localhost:8000 ব্যবহার করুন।', 'error', 10000);
            stopVoice();
            return;
          }
          if (e.error === 'not-allowed') {
            showVoiceToast('❌ মাইক্রোফোন পারমিশন দেওয়া হয়নি। ব্রাউজার সেটিংসে Mic allow করুন।', 'error', 6000);
            stopVoice();
            return;
          }
          if (e.error !== 'aborted') {
            showVoiceToast('Voice error: ' + (e.error || 'unknown'), 'warning', 4000);
          }
        };

        recognition.onend = () => {
          if (isVoiceActive && recognition) {
            try {
              recognition.start();
            } catch (_) {
              setTimeout(() => {
                if (isVoiceActive && recognition) try { recognition.start(); } catch(_) {}
              }, 400);
            }
          } else {
            const btn = document.getElementById('voiceBtn');
            if (btn) btn.classList.remove('voice-on');
          }
        };

        recognition.start();
      } catch (err) {
        console.error(err);
        showVoiceToast('Voice control error: ' + err.message, 'error', 5000);
        stopVoice();
      }
    }

    document.getElementById('voiceBtn').addEventListener('click', () => {
      isVoiceActive ? stopVoice() : startVoice();
