<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Design Tools</title>
  <style>
    :root{--bg:#0b1020;--panel:#11182b;--line:#283451;--muted:#93a2bf;--text:#edf4ff;--accent:#5eead4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif;display:grid;grid-template-columns:340px 1fr}.tools{padding:20px;overflow:auto;border-right:1px solid var(--line);background:#0d1425}.title{margin:0 0 4px;font-size:21px}.hint{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.5}.section{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:rgba(20,29,51,.75)}h2{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#aab8d1}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}input,select,button{font:inherit}input[type=text],select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#080d1b;color:var(--text)}input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#080d1b;padding:3px}input[type=range]{width:100%;accent-color:var(--accent)}.range-label{display:flex;justify-content:space-between}.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preset,.action{border:1px solid var(--line);background:#141e35;color:var(--text);border-radius:9px;padding:10px;cursor:pointer;font-weight:700}.preset:hover,.preset.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(94,234,212,.2),rgba(129,140,248,.18))}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action.primary{background:#14b8a6;color:#06201e;border-color:#5eead4}.workspace{min-width:0;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 10%,#1b2a4a 0,#0b1020 52%)}.canvas-wrap{width:min(100%,1100px);box-shadow:0 22px 70px rgba(0,0,0,.4);border:1px solid #34435f;background:#111}.canvas-wrap canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 56px);object-fit:contain;touch-action:none}.tip{margin:12px 0 0;color:var(--muted);font-size:12px;text-align:center}.upload{display:block;border:1px dashed #405174;border-radius:10px;padding:11px;text-align:center;color:#c6d4eb;cursor:pointer}.upload input{display:none}@media(max-width:850px){body{grid-template-columns:1fr}.tools{border-right:0;border-bottom:1px solid var(--line)}.workspace{padding:14px}.canvas-wrap canvas{max-height:none}}
  </style>
</head>
<body>
  <aside class="tools">
    <h1 class="title">Design Tools</h1>
    <p class="hint">হালকা design canvas — কোনো library নেই। টেক্সট ধরে টানুন, ডান পাশের গোল handle টেনে ছোট-বড় করুন।</p>
    <section class="section">
      <h2>ছবি ও টেক্সট</h2>
      <label class="upload">🖼️ ব্যাকগ্রাউন্ড ছবি বাছাই করুন<input id="imageInput" type="file" accept="image/*"></label>
      <div class="field"><label for="textInput">টেক্সট</label><input id="textInput" type="text" value="NEW COLLECTION" maxlength="80"></div>
      <div class="field"><label for="fontInput">ফন্ট</label><select id="fontInput"><option value="Arial Black, Arial, sans-serif">Bold Sans</option><option value="Georgia, serif">Classic Serif</option><option value="Trebuchet MS, sans-serif">Modern</option><option value="cursive">Script</option></select></div>
      <div class="field"><div class="range-label"><label for="sizeInput">Text Size</label><strong id="sizeValue">82 px</strong></div><input id="sizeInput" type="range" min="18" max="260" value="82"></div>
      <div class="field"><label for="colorInput">Text Color</label><input id="colorInput" type="color" value="#ffffff"></div>
    </section>
    <section class="section"><h2>One-click Style Pack</h2><div class="preset-grid" id="presetGrid"><button class="preset active" data-preset="fashion">Fashion</button><button class="preset" data-preset="luxury">Luxury</button><button class="preset" data-preset="neon">Neon</button><button class="preset" data-preset="minimal">Minimal</button><button class="preset" data-preset="wedding">Wedding</button><button class="preset" data-preset="sale">Sale</button></div></section>
    <section class="section"><div class="action-row"><button class="action" id="centerBtn">↔ Center</button><button class="action" id="resetBtn">↺ Reset</button><button class="action primary" id="downloadBtn" style="grid-column:1/-1">⬇ PNG Download</button></div></section>
  </aside>
  <main class="workspace"><div><div class="canvas-wrap"><canvas id="canvas" width="1200" height="900"></canvas></div><p class="tip">Text-এর ওপর drag করে সরান • ডানদিকের turquoise গোল handle drag করে resize করুন</p></div></main>
  <script>
    const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
    const el=id=>document.getElementById(id);
    const state={text:'NEW COLLECTION',x:600,y:450,size:82,color:'#ffffff',font:'Arial Black, Arial, sans-serif',shadow:'rgba(0,0,0,.42)',shadowBlur:14,shadowX:5,shadowY:7,image:null,drag:null};
    const styles={fashion:{color:'#ffffff',font:'Trebuchet MS, sans-serif',shadow:'#8b5cf6',blur:18},luxury:{color:'#f8d58a',font:'Georgia, serif',shadow:'#6f3b08',blur:13},neon:{color:'#67e8f9',font:'Arial Black, Arial, sans-serif',shadow:'#a855f7',blur:28},minimal:{color:'#ffffff',font:'Trebuchet MS, sans-serif',shadow:'rgba(0,0,0,.35)',blur:6},wedding:{color:'#ffe4f1',font:'Georgia, serif',shadow:'#b45375',blur:18},sale:{color:'#fff200',font:'Arial Black, Arial, sans-serif',shadow:'#d90000',blur:16}};
    function cover(img){const r=Math.max(canvas.width/img.width,canvas.height/img.height),w=img.width*r,h=img.height*r;ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}
    function box(){ctx.save();ctx.font=`800 ${state.size}px ${state.font}`;const m=ctx.measureText(state.text||' '),top=state.y-state.size*.84;ctx.restore();return{x:state.x-m.width/2-12,y:top-12,w:m.width+24,h:state.size*1.22+24}}
    function draw(){const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);g.addColorStop(0,'#263a62');g.addColorStop(1,'#101726');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);if(state.image)cover(state.image);ctx.save();ctx.font=`800 ${state.size}px ${state.font}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=state.color;ctx.shadowColor=state.shadow;ctx.shadowBlur=state.shadowBlur;ctx.shadowOffsetX=state.shadowX;ctx.shadowOffsetY=state.shadowY;ctx.fillText(state.text||' ',state.x,state.y);ctx.restore();const b=box();ctx.save();ctx.strokeStyle='#5eead4';ctx.setLineDash([9,6]);ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.setLineDash([]);ctx.fillStyle='#5eead4';ctx.beginPath();ctx.arc(b.x+b.w,b.y+b.h,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#06201e';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('↘',b.x+b.w,b.y+b.h+1);ctx.restore()}
    function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
    canvas.addEventListener('pointerdown',e=>{const p=canvasPoint(e),b=box(),hx=b.x+b.w,hy=b.y+b.h;if(Math.hypot(p.x-hx,p.y-hy)<28)state.drag={kind:'resize',x:p.x,size:state.size};else if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)state.drag={kind:'move',dx:p.x-state.x,dy:p.y-state.y};else return;canvas.setPointerCapture(e.pointerId);e.preventDefault()});
    canvas.addEventListener('pointermove',e=>{if(!state.drag)return;const p=canvasPoint(e);if(state.drag.kind==='move'){state.x=Math.max(0,Math.min(canvas.width,p.x-state.drag.dx));state.y=Math.max(0,Math.min(canvas.height,p.y-state.drag.dy))}else{state.size=Math.max(18,Math.min(260,state.drag.size+(p.x-state.drag.x)*.45));syncSize()}draw()});
    canvas.addEventListener('pointerup',()=>state.drag=null);canvas.addEventListener('pointercancel',()=>state.drag=null);
    function syncSize(){el('sizeInput').value=Math.round(state.size);el('sizeValue').textContent=`${Math.round(state.size)} px`}
    function preset(name){const s=styles[name];state.color=s.color;state.font=s.font;state.shadow=s.shadow;state.shadowBlur=s.blur;el('colorInput').value=s.color;el('fontInput').value=s.font;document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',b.dataset.preset===name));draw()}
    el('textInput').addEventListener('input',e=>{state.text=e.target.value;draw()});el('fontInput').addEventListener('change',e=>{state.font=e.target.value;draw()});el('colorInput').addEventListener('input',e=>{state.color=e.target.value;draw()});el('sizeInput').addEventListener('input',e=>{state.size=Number(e.target.value);syncSize();draw()});
    el('presetGrid').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)preset(b.dataset.preset)});el('centerBtn').onclick=()=>{state.x=canvas.width/2;state.y=canvas.height/2;draw()};
    el('imageInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{state.image=img;draw()};img.src=URL.createObjectURL(f)});
    el('resetBtn').onclick=()=>window.resetDesignTools();el('downloadBtn').onclick=()=>{const b=box();ctx.clearRect(b.x-2,b.y-2,b.w+4,b.h+4);const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);g.addColorStop(0,'#263a62');g.addColorStop(1,'#101726');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);if(state.image)cover(state.image);ctx.save();ctx.font=`800 ${state.size}px ${state.font}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=state.color;ctx.shadowColor=state.shadow;ctx.shadowBlur=state.shadowBlur;ctx.shadowOffsetX=state.shadowX;ctx.shadowOffsetY=state.shadowY;ctx.fillText(state.text||' ',state.x,state.y);ctx.restore();const a=document.createElement('a');a.download='design.png';a.href=canvas.toDataURL('image/png');a.click();draw()};
    window.resetDesignTools=()=>{Object.assign(state,{text:'NEW COLLECTION',x:600,y:450,size:82,color:'#ffffff',font:'Arial Black, Arial, sans-serif',shadow:'rgba(0,0,0,.42)',shadowBlur:14,shadowX:5,shadowY:7,image:null,drag:null});el('textInput').value=state.text;el('fontInput').value=state.font;el('colorInput').value=state.color;el('imageInput').value='';syncSize();preset('fashion')};preset('fashion');
  </script>
</body>
</html>
